<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KIHINDI SACCO – Management System</title>
  <link rel="icon" href="icons/kihindi-sacco-logo.jpg" />
  <link rel="apple-touch-icon" href="icons/kihindi-sacco-logo.jpg" />
  <link rel="manifest" href="/settings/manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --green-900: #073b2e;
      --green-800: #0b4a39;
      --green-700: #17664f;
      --green-600: #278268;
      --green-500: #4eaf8e;
      --gold: #d4a62a;
      --gold-deep: #b88a1f;
      --gold-light: #f2d57a;
      --bg: linear-gradient(135deg, #083e33 0%, #1c7b63 100%);
      --white: #ffffff;
      --shadow: 0 14px 32px rgba(7, 42, 33, 0.14);
      --shadow-hover: 0 20px 42px rgba(7, 42, 33, 0.18);
      --radius: 18px;
      --radius-sm: 12px;
      --border: #dfeadf;
      --text: #172a22;
      --text-muted: #5f7369;
      --font: 'Plus Jakarta Sans', sans-serif;
    }
    body {
      font-family: var(--font);
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: var(--text);
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: var(--green-800); border-radius: 10px; }

    .top-nav {
      background: var(--green-800);
      color: white;
      padding: 0.6rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
      height: 70px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    }
    .top-nav .brand {
      font-size: 1.4rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .top-nav .brand i { color: var(--gold); font-size: 1.6rem; }
    .top-nav .brand span { color: var(--gold); }
    .top-nav .user-info {
      display: flex;
      align-items: center;
      gap: 1rem;
      color: white;
    }
    .top-nav .user-info .badge {
      background: var(--gold);
      color: var(--green-800);
      padding: 0.2rem 0.8rem;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .top-nav .user-info .logout-btn {
      background: rgba(255,255,255,0.15);
      border: none;
      color: white;
      padding: 0.3rem 0.8rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-weight: 500;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
    }
    .top-nav .user-info .logout-btn:hover {
      background: rgba(255,255,255,0.25);
    }

    .sidebar {
      width: 250px;
      background: var(--green-800);
      color: white;
      padding: 1.5rem 1rem;
      position: fixed;
      top: 70px;
      left: 0;
      bottom: 0;
      overflow-y: auto;
      z-index: 99;
    }
    .sidebar nav a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0.7rem 1rem;
      color: rgba(255,255,255,0.7);
      text-decoration: none;
      border-radius: var(--radius-sm);
      transition: 0.2s;
      margin-bottom: 0.2rem;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .sidebar nav a:hover,
    .sidebar nav a.active {
      background: rgba(255,255,255,0.12);
      color: white;
    }
    .sidebar nav a.active {
      background: var(--gold);
      color: var(--green-800);
      font-weight: 600;
    }
    .sidebar nav a i { width: 20px; text-align: center; }

    .main-content {
      margin-left: 250px;
      padding: 1.5rem 2rem;
      margin-top: 70px;
      min-height: calc(100vh - 70px);
    }

    .page-header {
      margin-bottom: 1.5rem;
    }
    .page-header h1 {
      font-size: 1.6rem;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .page-header h1 i { color: var(--gold); }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      background: var(--white);
      padding: 1.2rem 1.5rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      transition: 0.25s ease;
    }
    .stat-card:hover {
      box-shadow: var(--shadow-hover);
      transform: translateY(-3px);
      border-color: var(--gold);
    }
    .stat-card .stat-number {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--green-800);
    }
    .stat-card .stat-label {
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    .stat-card .stat-icon {
      float: right;
      font-size: 2rem;
      color: var(--gold-light);
    }

    .card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 1.5rem;
      transition: 0.25s ease;
    }
    .card:hover { box-shadow: var(--shadow-hover); }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .card-header h2 {
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-header h2 i { color: var(--gold); }
    .card-header .btn {
      background: var(--green-800);
      color: white;
      border: none;
      padding: 0.4rem 1.2rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-weight: 500;
      font-size: 0.85rem;
      transition: 0.2s;
    }
    .card-header .btn:hover { background: var(--green-700); }
    .card-header .btn-gold {
      background: var(--gold);
      color: var(--green-800);
    }
    .card-header .btn-gold:hover { background: var(--gold-light); }
    .card-header .view-all {
      color: var(--gold);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .card-header .view-all:hover { text-decoration: underline; }

    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    table thead th {
      background: #f5f3ed;
      color: var(--text);
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 0.6rem 0.5rem;
      text-align: left;
      border-bottom: 2px solid var(--border);
    }
    table tbody td {
      padding: 0.6rem 0.5rem;
      border-bottom: 1px solid #f5f3ec;
      font-size: 0.9rem;
    }
    table tbody tr:hover { background: #faf8f0; }

    .form-group { margin-bottom: 1rem; }
    .form-group label {
      display: block;
      font-weight: 500;
      margin-bottom: 0.2rem;
      font-size: 0.9rem;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 0.6rem 0.8rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      transition: 0.2s;
    }
    .form-group input:focus,
    .form-group select:focus {
      border-color: var(--gold);
      outline: none;
      box-shadow: 0 0 0 3px rgba(212,160,23,0.15);
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-actions {
      display: flex;
      gap: 1rem;
      justify-content: flex-end;
      margin-top: 1rem;
    }
    .form-actions .btn-primary {
      background: var(--green-800);
      color: white;
      border: none;
      padding: 0.6rem 2rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }
    .form-actions .btn-primary:hover { background: var(--green-700); }
    .form-actions .btn-secondary {
      background: #e8e5dd;
      color: var(--text);
      border: none;
      padding: 0.6rem 2rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-weight: 500;
      transition: 0.2s;
    }
    .form-actions .btn-secondary:hover { background: #d5d0c5; }
    .checkbox-group {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .checkbox-group label {
      font-weight: 400;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
    }
    .checkbox-group input[type="checkbox"],
    .checkbox-group input[type="radio"] {
      width: 18px;
      height: 18px;
      accent-color: var(--green-800);
    }

    .badge {
      padding: 0.15rem 0.6rem;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: capitalize;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 78px;
    }
    .badge-active { background: #dff6e7; color: #166d4c; }
    .badge-pending { background: #fff4d6; color: #8a6800; border: 1px solid #f1d67d; }
    .badge-approved { background: #e8f7ee; color: #176c46; border: 1px solid #a9d7bc; }
    .badge-rejected { background: #ffe9e8; color: #b42318; border: 1px solid #efb1aa; }

    .status-filter-group {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    .status-filter {
      border: 1px solid var(--border);
      background: #f3f7f4;
      color: var(--green-800);
      border-radius: 999px;
      padding: 0.55rem 1rem;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.8rem;
      transition: 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
    }
    .status-filter:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(13, 77, 61, 0.08);
    }
    .status-filter.pending { background: #fff8dc; color: #8a6800; border-color: #edd67f; }
    .status-filter.pending.active,
    .status-filter.pending:hover { background: #fbe7a1; color: #7f5a00; }
    .status-filter.approved { background: #ebf9f0; color: #166d4c; border-color: #afd9bf; }
    .status-filter.approved.active,
    .status-filter.approved:hover { background: #d8f3e1; color: #0d5d3d; }
    .status-filter.rejected { background: #fff1f0; color: #b42318; border-color: #efbbba; }
    .status-filter.rejected.active,
    .status-filter.rejected:hover { background: #ffdfe0; color: #9f221b; }

    .status-action {
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 0.38rem 0.8rem;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
    }
    .status-action.approve {
      background: #eafaf0;
      color: #166d4c;
      border-color: #b8e0c4;
    }
    .status-action.approve:hover {
      background: #dff5e6;
      box-shadow: 0 6px 14px rgba(22, 109, 76, 0.12);
    }
    .status-action.reject {
      background: #fff1f0;
      color: #b42318;
      border-color: #efbcb8;
    }
    .status-action.reject:hover {
      background: #ffe3e1;
      box-shadow: 0 6px 14px rgba(180, 35, 24, 0.1);
    }
    .table-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .table-action {
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 0.38rem 0.8rem;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
    }
    .table-action.view {
      background: #f2f6f4;
      color: var(--green-800);
      border-color: #dfeae3;
    }
    .table-action.view:hover {
      background: #e6f1eb;
      box-shadow: 0 6px 14px rgba(13, 77, 61, 0.08);
    }
    .table-action.edit {
      background: #f6f7f8;
      color: #2a3b34;
      border-color: #dfe5e1;
    }
    .table-action.edit:hover {
      background: #edf1f0;
      box-shadow: 0 6px 14px rgba(34, 53, 47, 0.08);
    }
    .table-action.delete {
      background: #fff1f0;
      color: #b42318;
      border-color: #f0b9b3;
    }
    .table-action.delete:hover {
      background: #ffe3e1;
      box-shadow: 0 6px 14px rgba(180, 35, 24, 0.1);
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 200;
      -webkit-backdrop-filter: blur(2px);
      backdrop-filter: blur(2px);
    }
    .modal.active { display: flex; }
    .modal-content {
      background: var(--white);
      padding: 2rem;
      border-radius: var(--radius);
      max-width: 600px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      position: relative;
    }
    .modal-content .close {
      position: absolute;
      top: 1rem; right: 1.5rem;
      font-size: 1.8rem;
      cursor: pointer;
      color: #999;
      transition: 0.2s;
    }
    .modal-content .close:hover { color: #333; }
    .modal-content h2 { color: var(--green-800); margin-bottom: 1rem; }

    .photo-upload {
      border: 2px dashed var(--border);
      padding: 1rem;
      text-align: center;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: 0.2s;
      background: #faf8f2;
    }
    .photo-upload:hover { border-color: var(--gold); background: #f5f0e6; }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 0.8rem 1.5rem;
      border-radius: var(--radius-sm);
      color: white;
      font-weight: 500;
      z-index: 999;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      animation: slideUp 0.3s ease;
      max-width: 400px;
    }
    .toast.success { background: var(--green-800); }
    .toast.error { background: #c0392b; }
    .toast.info { background: #2980b9; }
    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .login-container {
      max-width: 400px;
      margin: 2rem auto;
      background: var(--white);
      padding: 2.5rem;
      border-radius: var(--radius);
      box-shadow: 0 20px 60px rgba(0,0,0,0.1);
    }
    .login-container h1 {
      color: var(--green-800);
      text-align: center;
      margin-bottom: 0.2rem;
    }
    .login-container .motto {
      color: var(--gold);
      text-align: center;
      font-style: italic;
      margin-bottom: 1.5rem;
    }
    .login-container .form-group { margin-bottom: 1rem; }
    .login-container .btn {
      width: 100%;
      padding: 0.8rem;
      background: var(--green-800);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .login-container .btn:hover { background: var(--green-700); }

    @media (max-width: 768px) {
      .sidebar { width: 200px; }
      .main-content { margin-left: 200px; padding: 1rem; }
      .top-nav { padding: 0.4rem 1rem; }
      .top-nav .brand { font-size: 1.2rem; }
      .form-row { grid-template-columns: 1fr; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 576px) {
      .sidebar { width: 180px; }
      .main-content { margin-left: 180px; padding: 0.8rem; }
      .stats-grid { grid-template-columns: 1fr; }
    }

    /* Modern cooperative dashboard */
    :root {
      --green-900: #073b2e;
      --green-800: #0b4a39;
      --green-700: #17664f;
      --green-600: #278268;
      --gold: #d4a62a;
      --gold-light: #f2d57a;
      --bg: linear-gradient(135deg, #083e33 0%, #1c7b63 100%);
      --border: #dfeadf;
      --text: #172a22;
      --text-muted: #6d7c74;
      --shadow: 0 8px 24px rgba(10, 61, 46, 0.06);
      --shadow-hover: 0 14px 32px rgba(10, 61, 46, 0.1);
      --radius: 18px;
      --radius-sm: 11px;
    }
    body { background: var(--bg); }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #d5e1da; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #a9bcaf; }
    .top-nav {
      position: fixed;
      inset: 0 0 auto;
      height: 72px;
      padding: 0 2rem;
      background: rgba(255,255,255,0.96);
      color: var(--text);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 3px 16px rgba(20, 50, 38, 0.035);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
    }
    .top-nav .brand { color: var(--green-900); letter-spacing: -0.04em; }
    .top-nav .brand i { color: var(--green-700); }
    .top-nav .brand span { color: var(--green-700); }
    .top-nav .user-info { gap: 0.75rem; color: var(--text); }
    .top-nav .user-info .badge {
      background: #edf5f0;
      color: var(--green-800);
      padding: 0.35rem 0.7rem;
      letter-spacing: 0.04em;
    }
    .top-nav .user-info .logout-btn {
      background: #f4f7f5;
      color: var(--text);
      padding: 0.55rem 0.85rem;
      border: 1px solid var(--border);
    }
    .top-nav .user-info .logout-btn:hover { background: #eaf1ed; }
    .sidebar {
      top: 72px;
      width: 258px;
      padding: 1.5rem 1rem;
      background: #fff;
      color: var(--text);
      border-right: 1px solid var(--border);
    }
    .sidebar nav::before {
      content: 'WORKSPACE';
      display: block;
      padding: 0.25rem 0.9rem 0.8rem;
      color: #99a79f;
      font-size: 0.67rem;
      font-weight: 800;
      letter-spacing: 0.13em;
    }
    .sidebar nav a {
      padding: 0.78rem 0.9rem;
      margin-bottom: 0.35rem;
      color: #68786f;
      font-size: 0.86rem;
      font-weight: 600;
    }
    .sidebar nav a:hover,
    .sidebar nav a.active {
      background: #eff6f1;
      color: var(--green-800);
    }
    .sidebar nav a.active {
      box-shadow: inset 3px 0 0 var(--green-700);
      font-weight: 700;
    }
    .sidebar nav a i { color: #80958a; }
    .sidebar nav a.active i { color: var(--green-700); }
    .main-content {
      margin: 72px 0 0 258px;
      padding: 2rem clamp(1.25rem, 3vw, 2.75rem);
      min-height: calc(100vh - 72px);
    }
    .page-header { margin-bottom: 1.5rem; }
    .page-header h1 { color: var(--gold-light); font-size: 1.55rem; font-weight: 750; letter-spacing: -0.04em; }
    .page-header h1 i { color: var(--gold); }
    .stats-grid { gap: 1rem; margin-bottom: 1.25rem; }
    .stat-card {
      position: relative;
      overflow: hidden;
      min-height: 150px;
      padding: 1.2rem 1.25rem;
      border: 1px solid #e8eeea;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .stat-card::after {
      content: '';
      position: absolute;
      width: 100px;
      height: 100px;
      right: -36px;
      bottom: -46px;
      border-radius: 50%;
      background: #f2f7f3;
      pointer-events: none;
    }
    .stat-card:hover { border-color: #d5e5da; }
    .stat-card .stat-icon {
      float: none;
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      margin-bottom: 1rem;
      border-radius: 13px;
      background: #edf5f0;
      color: var(--green-700);
      font-size: 1.05rem;
    }
    .stat-card:nth-child(2) .stat-icon { background: #fdf5df; color: #b58a25; }
    .stat-card:nth-child(3) .stat-icon { background: #eef2fb; color: #6177b7; }
    .stat-card:nth-child(4) .stat-icon { background: #f9eeee; color: #b16d63; }
    .stat-card .stat-number {
      position: relative;
      z-index: 1;
      margin-bottom: 0.25rem;
      color: var(--green-900);

<body>

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" style="display:flex; justify-content:center; align-items:center; min-height:100vh;">
    <div class="login-container">
      <img class="login-logo" src="icons/kihindi-sacco-logo.jpg" alt="Mbarara City Kihindi Boda Rider's SACCO logo" />
      <h1>KIHINDI SACCO</h1>
      <div class="motto">Faith in God Leads to Success</div>
      <form id="loginForm">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="loginUsername" placeholder="Enter username" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="Enter password" />
        </div>
        <button class="btn" type="submit">Login</button>
      </form>
      <p style="text-align:center;color:#888;font-size:0.8rem;margin-top:1rem;">
        Use your credentials provided by the SACCO.
      </p>
    </div>
  </div>

  <!-- APP SHELL -->
  <div id="appShell" style="display:none;">
    <!-- TOP NAVBAR -->
    <nav class="top-nav">
      <div class="brand">
        <img class="brand-logo" src="icons/kihindi-sacco-logo.jpg" alt="" />
        <span>KIHINDI</span> SACCO
      </div>
      <div class="user-info" id="userInfo">
        <span class="badge" id="userRole">ADMIN</span>
        <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </nav>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <nav>
        <a class="active" data-page="dashboard"><i class="fas fa-chart-pie"></i> Dashboard</a>
        <a data-page="members"><i class="fas fa-users"></i> Members</a>
        <a data-page="member-applications"><i class="fas fa-file-signature"></i> Member Applications</a>
        <a data-page="loan-applications"><i class="fas fa-file-invoice"></i> Loan Applications</a>
        <a data-page="savings"><i class="fas fa-piggy-bank"></i> Savings</a>
        <a data-page="deposits"><i class="fas fa-file-invoice"></i> Fixed Deposits</a>
        <a data-page="loans"><i class="fas fa-hand-holding-usd"></i> Loans</a>
        <a data-page="reports"><i class="fas fa-flag"></i> Reports</a>
        <a data-page="staff"><i class="fas fa-user-cog"></i> Staff Access</a>
        <a data-page="logo-settings" id="logoSettingsNav" class="logo-settings-nav"><i class="fas fa-image"></i> SACCO Logo</a>
        <a onclick="logout()" style="margin-top:1rem; border-top:1px solid rgba(255,255,255,0.1); padding-top:1rem;">
          <i class="fas fa-sign-out-alt"></i> Logout
        </a>
      </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="main-content" id="mainContent">
      <!-- Pages injected here -->
    </div>
  </div>

  <!-- MODAL -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toast" class="toast" style="display:none;"></div>

  <script>
    // ============================================================
    // GLOBALS
    // ============================================================
    let token = localStorage.getItem('token');
    let currentUser = null;
    let charts = {};
    let allMembers = [];
    let allLoans = [];
    let allLoanApplications = [];
    let loanApplicationStatus = 'pending';
    let saccoLogoUrl = 'icons/kihindi-sacco-logo.jpg';
    const isLocalLiveServer = ['localhost', '127.0.0.1'].includes(window.location.hostname)
      && window.location.port !== '5000';
    const API_BASE_URL = isLocalLiveServer ? 'http://localhost:5000' : '';

    function apiUrl(endpoint) {
      return `${API_BASE_URL}${endpoint}`;
    }

    function assetUrl(path) {
      if (!path || /^(https?:|data:)/i.test(path)) return path;
      return isLocalLiveServer && path.startsWith('/') ? `${API_BASE_URL}${path}` : path;
    }

    function updateSaccoLogoImages() {
      const fallbackLogo = 'icons/kihindi-sacco-logo.jpg';
      document.querySelectorAll('.login-logo, .brand-logo, .receipt-logo, .reports-logo').forEach(image => {
        image.onerror = () => {
          image.onerror = null;
          image.src = assetUrl(fallbackLogo);
        };
        image.src = assetUrl(saccoLogoUrl);
      });
      document.querySelectorAll('link[rel="icon"], link[rel="apple-touch-icon"]').forEach(link => {
        link.href = assetUrl(saccoLogoUrl);
      });
    }

    // ============================================================
    // AUTH
    // ============================================================
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const username = document.getElementById('loginUsername').value;
      const password = document.getElementById('loginPassword').value;
      login(username, password);
    });

    function login(username, password) {
      fetch(apiUrl('/auth/login'), {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      })
      .then(res => res.json())
      .then(data => {
        if (data.token) {
          token = data.token;
          localStorage.setItem('token', token);
          currentUser = data.user;
          localStorage.setItem('user', JSON.stringify(currentUser));
          showApp();
        } else {
          showToast(data.error || 'Login failed', 'error');
        }
      })
      .catch(() => showToast(isLocalLiveServer
        ? 'Cannot reach the local API. Start it in VS Code with npm.cmd run dev, then try again.'
        : 'Server error', 'error'));
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      token = null;
      currentUser = null;
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('appShell').style.display = 'none';
    }

    function showApp() {
      const userRoleEl = document.getElementById('userRole');

      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('appShell').style.display = 'block';
      userRoleEl.textContent = (currentUser.role || '').toUpperCase();
      document.getElementById('logoSettingsNav').style.display = ['admin', 'chairperson'].includes(getUserRole()) ? 'flex' : 'none';
      loadSaccoLogo();
      loadPage('dashboard');
    }

    function loadSaccoLogo() {
      fetch(apiUrl('/settings/logo'), { headers: { 'Authorization': `Bearer ${token}` } })
        .then(res => res.ok ? res.json() : null)
        .then(data => {
          if (data?.logoUrl) {
            saccoLogoUrl = data.logoUrl;
            updateSaccoLogoImages();
          }
        })
        .catch(() => {});
    }

    // ============================================================
    // API HELPER
    // ============================================================
    function apiFetch(endpoint, options = {}) {
      return fetch(apiUrl(endpoint), {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`,
          ...options.headers
        }
      }).then(res => {
        if (res.status === 401) { logout(); throw new Error('Session expired'); }
        return res.json();
      });
    }

    // ============================================================
    // NAVIGATION
    // ============================================================
    document.querySelectorAll('.sidebar nav a[data-page]').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const page = link.dataset.page;
        loadPage(page);
      });
    });

    function loadPage(page) {
      document.querySelectorAll('.sidebar nav a[data-page]').forEach(a => a.classList.remove('active'));
      document.querySelector(`.sidebar nav a[data-page="${page}"]`)?.classList.add('active');

      switch(page) {
        case 'dashboard': loadDashboard(); break;
        case 'members': loadMembers(); break;
        case 'member-applications': loadMemberApplications(); break;
        case 'loan-applications': loadLoanApplications(); break;
        case 'savings': loadSavings(); break;
        case 'deposits': loadDeposits(); break;
        case 'loans': loadLoans(); break;
        case 'reports': loadReports(); break;
        case 'staff': loadStaff(); break;
        case 'logo-settings': loadLogoSettings(); break;
        default: document.getElementById('mainContent').innerHTML = '<p>Page not found</p>';
      }
    }

    // ============================================================
    // TOAST & MODAL
    // ============================================================
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = `toast ${type}`;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 4000);
    }

    function openModal(html) {
      document.getElementById('modalBody').innerHTML = html;
      document.getElementById('modal').classList.add('active');
    }
    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, character => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[character]);
    }

    async function loadActiveMembers({ requireSavingsAccount = false } = {}) {
      const requests = [apiFetch('/members')];
      if (requireSavingsAccount) requests.push(apiFetch('/savings'));
      const [members, savingsAccounts] = await Promise.all(requests);
      if (!Array.isArray(members)) throw new Error(members?.error || 'Could not load members');

      const eligibleIds = requireSavingsAccount
        ? new Set((Array.isArray(savingsAccounts) ? savingsAccounts : [])
            .filter(account => account.status === 'active')
            .map(account => Number(account.member_id)))
        : null;
      return members
        .filter(member => member.status === 'active' && (!eligibleIds || eligibleIds.has(Number(member.id))))
        .sort((left, right) => String(left.full_name).localeCompare(String(right.full_name)));
    }

    function showTransactionReceipt(data) {
      const receipt = data.receipt || {};
      const receiptType = receipt.transaction_type || 'Transaction';
      const currency = value => `UGX ${Number(value || 0).toLocaleString('en-UG', { maximumFractionDigits: 2 })}`;
      const rows = [
        ['Receipt number', data.receipt_no],
        ['Member name', receipt.member_name],
        ['Membership number', receipt.membership_no],
        ['Account number', receipt.account_no],
        ['Transaction', receiptType],
        ['Description', receipt.description],
        ['Date', receipt.date],
        ['Amount', currency(receipt.amount)],
        ['Payment method', receipt.payment_mode],
        ['Reference', receipt.reference_no],
        ['National ID', receipt.national_id],
        ['Interest rate', receipt.interest_rate ? `${receipt.interest_rate}% p.a.` : ''],
        ['Tenor', receipt.tenor_months ? `${receipt.tenor_months} months` : ''],
        ['Maturity date', receipt.maturity_date],
        ['Interest payment', receipt.interest_payment],
        ['Remaining loan balance', receipt.new_balance !== undefined ? currency(receipt.new_balance) : ''],
        ['New account balance', data.newBalance !== undefined ? currency(data.newBalance) : '']
      ].filter(([, value]) => value !== undefined && value !== null && value !== '');
      openModal(`
        <article class="receipt">
          <header class="receipt-header">
            <img class="receipt-logo" src="${escapeHtml(assetUrl(saccoLogoUrl))}" alt="Mbarara City Kihindi Boda Rider's SACCO logo" />
            <div>
              <h2>MBARARA CITY KIHINDI BODA RIDER'S SACCO</h2>
              <p>Faith in God Leads to Success</p>
            </div>
          </header>
          <h3 class="receipt-title">${escapeHtml(receiptType.toUpperCase())} RECEIPT</h3>
          <table class="receipt-details">
            <tbody>
              ${rows.map(([label, value]) => `<tr><th>${escapeHtml(label)}</th><td>${escapeHtml(value)}</td></tr>`).join('')}
            </tbody>
          </table>
          <div class="receipt-signatures">
            <div>Member's signature</div>
            <div>Cashier's signature</div>

          <p class="receipt-note">Thank you for banking with Kihindi SACCO.</p>

            <button type="button" class="btn-secondary" onclick="closeModal()">Close</button>
            <button type="button" class="btn-primary" onclick="window.print()"><i class="fas fa-print"></i> Print receipt</button>
          </div>
        </article>
      `);

      const rows = applications.map(app => `

      document.querySelectorAll('.status-filter[data-status]').forEach(button => {
        button.classList.toggle('active', button.dataset.status === loanApplicationStatus);
      });

    function loadCharts(summary = {}) {
      if (typeof Chart === 'undefined') {
        showToast('Charts are unavailable. Check your internet connection and try again.', 'error');
        return;
      }

      Promise.all([
        apiFetch('/reports/deposits-chart'),
        apiFetch('/reports/loans-chart')
      ])
        .then(([depositData, loanData]) => {
          if (!document.getElementById('depositsChart')) return;

          Object.values(charts).forEach(chart => chart?.destroy());
          charts = {};

          const deposits = Array.isArray(depositData) ? depositData : [];
          const loans = Array.isArray(loanData) ? loanData : [];
          const palette = ['#17664f', '#d4a62a', '#4eaf8e', '#6d83c4', '#b88a1f', '#a6c7a9', '#c87963', '#557c91', '#a9a0c3', '#91a768', '#d18c43', '#49665b'];
          const currency = amount => `UGX ${Number(amount || 0).toLocaleString(undefined, { maximumFractionDigits: 0 })}`;
          const renderPie = (canvasId, emptyId, labels, values, colors = palette) => {
            const canvas = document.getElementById(canvasId);
            const emptyState = document.getElementById(emptyId);
            if (!canvas || !emptyState) return;
            const validPoints = labels.map((label, index) => ({ label, value: Number(values[index] || 0) }))
              .filter(point => Number.isFinite(point.value) && point.value > 0);
            if (!validPoints.length) {
              canvas.style.display = 'none';
              emptyState.style.display = 'flex';
              return;
            }
            canvas.style.display = 'block';
            emptyState.style.display = 'none';
            charts[canvasId] = new Chart(canvas, {
              type: 'pie',
              data: {
                labels: validPoints.map(point => point.label),
                datasets: [{
                  data: validPoints.map(point => point.value),
                  backgroundColor: validPoints.map((_, index) => colors[index % colors.length]),
                  borderColor: '#ffffff',
                  borderWidth: 3,
                  hoverOffset: 9,
                  hoverBorderWidth: 4
                }]
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: { duration: 650, easing: 'easeOutQuart' },
                layout: { padding: 8 },
                plugins: {
                  legend: {
                    position: 'bottom',
                    labels: { usePointStyle: true, pointStyle: 'circle', padding: 16, boxWidth: 8, color: '#5f7369', font: { family: 'Plus Jakarta Sans', size: 11, weight: '600' } }
                  },
                  tooltip: {
                    backgroundColor: '#073b2e',
                    padding: 12,
                    cornerRadius: 10,
                    callbacks: {
                      label: context => {
                        const total = context.dataset.data.reduce((sum, value) => sum + Number(value || 0), 0);
                        const percent = total ? (Number(context.raw || 0) / total * 100).toFixed(1) : '0.0';
                        return ` ${context.label}: ${currency(context.raw)} (${percent}%)`;
                      }
                    }
                  }
                }
              }
            });
          };

          renderPie('depositsChart', 'depositsChartEmpty', deposits.map(row => row.month || 'Unknown'), deposits.map(row => row.total));
          renderPie('loansChart', 'loansChartEmpty', loans.map(row => row.product || 'Other'), loans.map(row => row.total));
          renderPie('portfolioChart', 'portfolioChartEmpty', ['Savings', 'Fixed deposits', 'Outstanding loans'], [
            summary.totalSavings,
            summary.totalDeposits,
            summary.outstandingLoans
          ], ['#17664f', '#d4a62a', '#6d83c4']);
        })
        .catch(() => showToast('Error loading report charts', 'error'));
    }

    async function exportReport(type) {
      if (!['pdf', 'excel'].includes(type)) return;
      const printWindow = type === 'pdf' ? window.open('', '_blank') : null;
      if (type === 'pdf' && !printWindow) {
        showToast('Allow pop-ups to print or save the PDF report.', 'error');
        return;
      }

      try {
        const [summary, depositData, loanData] = await Promise.all([
          apiFetch('/reports/dashboard'),
          apiFetch('/reports/deposits-chart'),
          apiFetch('/reports/loans-chart')
        ]);
        const deposits = Array.isArray(depositData) ? depositData : [];
        const loans = Array.isArray(loanData) ? loanData : [];
        const transactions = Array.isArray(summary.recentTransactions) ? summary.recentTransactions : [];
        const metrics = [
          ['Active members', Number(summary.totalMembers || 0)],
          ['Savings (UGX)', Number(summary.totalSavings || 0)],
          ['Fixed deposits (UGX)', Number(summary.totalDeposits || 0)],
          ['Outstanding loans (UGX)', Number(summary.outstandingLoans || 0)]
        ];
        const generatedAt = new Date().toLocaleString();

        if (type === 'excel') {
          const csvCell = value => {
            let text = String(value ?? '');
            if (typeof value === 'string' && /^[=+@\-\t\r]/.test(text)) text = `'${text}`;
            return `"${text.replace(/"/g, '""')}"`;
          };
          const rows = [
            ['KIHINDI SACCO REPORT', generatedAt],
            [],
            ['Summary', 'Value'],
            ...metrics,
            [],
            ['Fixed deposits by month', 'Amount (UGX)'],
            ...deposits.map(row => [row.month || 'Unknown', Number(row.total || 0)]),
            [],
            ['Loans by product', 'Amount (UGX)'],
            ...loans.map(row => [row.product || 'Other', Number(row.total || 0)]),
            [],
            ['Recent transactions', 'Member', 'Type', 'Amount (UGX)', 'Date'],
            ...transactions.map(item => [
              item.reference || '', item.Member?.full_name || 'N/A', item.type || '', Number(item.amount || 0), item.createdAt || item.created_at || ''
            ])
          ];
          const csv = rows.map(row => row.map(csvCell).join(',')).join('\r\n');
          const blob = new Blob(['\ufeff', csv], { type: 'text/csv;charset=utf-8;' });
          const url = URL.createObjectURL(blob);
          const link = document.createElement('a');
          link.href = url;
          link.download = `kihindi-sacco-report-${new Date().toISOString().slice(0, 10)}.csv`;
          document.body.appendChild(link);
          link.click();
          link.remove();
          URL.revokeObjectURL(url);
          showToast('Report downloaded as an Excel-compatible CSV file.');
          return;
        }

        const metricRows = metrics.map(([label, value]) => `
          <tr><th>${escapeHtml(label)}</th><td>${Number(value).toLocaleString()}</td></tr>
        `).join('');
        const reportLogoUrl = new URL(assetUrl(saccoLogoUrl), window.location.href).href;
        const transactionRows = transactions.map(item => `
          <tr>
            <td>${escapeHtml(item.createdAt || item.created_at || '—')}</td>
            <td>${escapeHtml(item.Member?.full_name || 'N/A')}</td>
            <td>${escapeHtml(item.type || '—')}</td>
            <td>UGX ${Number(item.amount || 0).toLocaleString()}</td>
          </tr>
        `).join('') || '<tr><td colspan="4">No transactions to show.</td></tr>';
        const depositRows = deposits.map(row => `<tr><td>${escapeHtml(row.month || 'Unknown')}</td><td>UGX ${Number(row.total || 0).toLocaleString()}</td></tr>`).join('') || '<tr><td colspan="2">No fixed-deposit data.</td></tr>';
        const loanRows = loans.map(row => `<tr><td>${escapeHtml(row.product || 'Other')}</td><td>UGX ${Number(row.total || 0).toLocaleString()}</td></tr>`).join('') || '<tr><td colspan="2">No loan data.</td></tr>';
        printWindow.addEventListener('load', () => printWindow.print(), { once: true });
        printWindow.document.write(`<!doctype html><html lang="en"><head><meta charset="utf-8"><title>KIHINDI SACCO Report</title><style>
          body{font:14px Arial,sans-serif;color:#172a22;margin:32px}.brand{display:flex;align-items:center;gap:16px;padding-bottom:16px;border-bottom:2px solid #d4a62a}.brand img{width:76px;height:76px;object-fit:contain}.brand h1,.brand p{margin:0}h1,h2{color:#0b4a39}p{color:#5f7369;margin-top:0}section{margin:24px 0}table{width:100%;border-collapse:collapse;margin-top:10px}th,td{text-align:left;padding:8px;border:1px solid #dfeadf}th{background:#f3f7f4}.metrics{max-width:600px}@media print{body{margin:12mm}}
          </style></head><body><header class="brand"><img src="${escapeHtml(reportLogoUrl)}" alt="KIHINDI SACCO logo"><div><h1>KIHINDI SACCO</h1><p>Management report · Generated ${escapeHtml(generatedAt)}</p></div></header>
          <section><h2>Summary</h2><table class="metrics"><tbody>${metricRows}</tbody></table></section>
          <section><h2>Fixed deposits by month</h2><table><thead><tr><th>Month</th><th>Amount</th></tr></thead><tbody>${depositRows}</tbody></table></section>
          <section><h2>Loans by product</h2><table><thead><tr><th>Product</th><th>Amount</th></tr></thead><tbody>${loanRows}</tbody></table></section>
          <section><h2>Recent transactions</h2><table><thead><tr><th>Date</th><th>Member</th><th>Type</th><th>Amount</th></tr></thead><tbody>${transactionRows}</tbody></table></section>
          `);
        printWindow.document.close();
      } catch (error) {
        printWindow?.close();
        showToast(error.message || 'Could not export the report', 'error');
      }
    }

    // ============================================================
    // STAFF
    // ============================================================
    function loadLogoSettings() {
      document.getElementById('mainContent').innerHTML = `
        <div class="page-header"><h1><i class="fas fa-image"></i> SACCO Logo</h1></div>
        <div class="card" style="max-width:680px;">
          <div class="card-header">
            <div>
              <h2>Update your SACCO logo</h2>
              <p class="card-subtitle">Choose an image from your computer, including your Downloads folder.</p>
            </div>
          </div>
          <form id="logoUploadForm">
            <div class="form-group" style="text-align:center;">
              <img id="logoPreview" src="${escapeHtml(assetUrl(saccoLogoUrl))}" alt="Current SACCO logo" style="width:180px;height:180px;object-fit:contain;margin:0 auto 1rem;border:1px solid var(--border);border-radius:12px;padding:0.5rem;background:#fff;" />
              <label for="logoFile" style="display:block;text-align:left;">Select logo image</label>
              <input id="logoFile" name="logo" type="file" accept=".png,.jpg,.jpeg,.webp,image/png,image/jpeg,image/webp" required />
              <small style="display:block;text-align:left;color:var(--text-muted);margin-top:0.4rem;">PNG, JPG, or WebP · Maximum 5 MB</small>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn-primary"><i class="fas fa-upload"></i> Upload logo</button>
            </div>
          </form>
        </div>
      `;

      const fileInput = document.getElementById('logoFile');
      fileInput.addEventListener('change', () => {
        const file = fileInput.files[0];
        if (file) document.getElementById('logoPreview').src = URL.createObjectURL(file);
      });

      document.getElementById('logoUploadForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const formData = new FormData(event.currentTarget);
        try {
          const response = await fetch(apiUrl('/settings/logo'), {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}` },
            body: formData
          });
          const data = await response.json();
          if (!response.ok || !data.success) throw new Error(data.error || 'Logo upload failed');
          saccoLogoUrl = data.logoUrl;
          updateSaccoLogoImages();
          showToast('SACCO logo updated successfully');
          loadLogoSettings();
        } catch (error) {
          showToast(error.message || 'Logo upload failed', 'error');
        }
      });
    }

    function loadStaff() {
      if (!isAdmin()) {
        showToast('Permission denied.', 'error');
        loadPage('dashboard');
        return;
      }
      apiFetch('/users')
        .then(data => {
          let rows = data.map(u => `
            <tr>
              <td>${u.id}</td>
              <td>${u.username && u.username.toLowerCase() === 'admin' ? 'System' : u.username}</td>
              <td>${u.role}</td>
              <td>
                <div class="table-actions">
                  <button class="table-action edit" onclick="editUser(${u.id})"><i class="fas fa-pen"></i> Edit</button>
                  <button class="table-action delete" onclick="deleteUser(${u.id})"><i class="fas fa-trash"></i> Delete</button>
                </div>
              </td>
            </tr>
          `).join('');
          let html = `
            <div class="page-header"><h1><i class="fas fa-user-cog"></i> Staff Access</h1></div>
            <div class="card">
              <div class="card-header">
                <h2>Staff Members</h2>
                <button class="btn" onclick="openUserForm()"><i class="fas fa-plus"></i> Add Staff</button>
              </div>
              <div class="table-responsive">
                <table>
                  <thead><tr><th>ID</th><th>Username</th><th>Role</th><th>Action</th></tr></thead>
                  <tbody>${rows || '<tr><td colspan="4" style="text-align:center;color:#999;">No staff</td></tr>'}</tbody>
                </table>
              </div>
            </div>
          `;
          document.getElementById('mainContent').innerHTML = html;
        })
        .catch(() => showToast('Error loading staff', 'error'));
    }

    function openUserForm() {
      const form = `
        <h2><i class="fas fa-user-plus"></i> Add Staff</h2>
        <form id="userForm">
          <div class="form-group"><label>Username</label><input type="text" name="username" required></div>
          <div class="form-group"><label>Password</label><input type="password" name="password" required></div>
          <div class="form-group"><label>Role</label>
            <select name="role">
              ${['admin', 'chairperson', 'manager', 'loans_officer', 'officer', 'treasurer'].map(role => `
                <option value="${role}">${role.replace('_', ' ').replace(/^\w/, character => character.toUpperCase())}</option>
              `).join('')}
            </select>
          </div>
          <div class="form-actions">
            <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
            <button type="submit" class="btn-primary">Save</button>
          </div>
        </form>
      `;
      openModal(form);
      document.getElementById('userForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const formData = new FormData(this);
        const obj = {};
        formData.forEach((v,k) => obj[k] = v);
        apiFetch('/users', { method: 'POST', body: JSON.stringify(obj) })
          .then(data => {
            if (data.success) {
              showToast('Staff added!');
              closeModal();
              loadStaff();
            } else {
              showToast(data.error || 'Failed', 'error');
            }
          })
          .catch(() => showToast('Server error', 'error'));
      });
    }

    function editUser(id) {
      apiFetch(`/users/${id}`)
        .then(user => {
          const form = `
            <h2><i class="fas fa-user-edit"></i> Edit Staff</h2>
            <form id="editUserForm">
              <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" value="${escapeHtml(user.username)}" required>
              </div>
              <div class="form-group">
                <label>Role</label>
                <select name="role">
                  ${['admin', 'chairperson', 'manager', 'loans_officer', 'officer', 'treasurer'].map(role => `
                    <option value="${role}" ${role === user.role ? 'selected' : ''}>${role.replace('_', ' ')}</option>
                  `).join('')}
                </select>
              </div>
              <div class="form-group">
                <label>New Password (optional)</label>
                <input type="password" name="password" placeholder="Leave blank to keep current password">
              </div>
              <div class="form-actions">
                <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
                <button type="submit" class="btn-primary">Update</button>
              </div>
            </form>
          `;
          openModal(form);

          document.getElementById('editUserForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const payload = { username: formData.get('username'), role: formData.get('role') };
            const password = String(formData.get('password') || '').trim();
            if (password) payload.password = password;

            apiFetch(`/users/${id}`, {
              method: 'PUT',
              body: JSON.stringify(payload)
            }).then(data => {
              if (data.success) {
                showToast('Staff updated');
                closeModal();
                loadStaff();
              } else {
                showToast(data.error || 'Update failed', 'error');
              }
            }).catch(() => showToast('Server error', 'error'));
          });
        })
        .catch(() => showToast('Error loading user', 'error'));
    }

    function deleteUser(id) {
      if (!confirm('Delete this user?')) return;
      apiFetch(`/users/${id}`, { method: 'DELETE' })
        .then(data => {
          if (data.success) {
            showToast('User deleted');
            loadStaff();
          } else {
            showToast(data.error || 'Failed', 'error');
          }
        });
    }

    // ============================================================
    // VIEW / EDIT MEMBER
    // ============================================================
    function viewMember(id) {
      apiFetch(`/members/${id}`)
        .then(member => {
          const details = [
            ['Membership No', member.membership_no],
            ['Full name', member.full_name],
            ['NIN', member.nin],
            ['Phone', member.phone],
            ['Status', member.status],
            ['Address', [member.village, member.parish, member.sub_county, member.district].filter(Boolean).join(', ') || 'N/A'],
            ['Next of kin', member.next_of_kin_name],
            ['Next of kin phone', member.next_of_kin_phone]
          ];

          openModal(`
            <h2><i class="fas fa-user"></i> Member Details</h2>
            <table style="width:100%;border-collapse:collapse;">
              <tbody>
                ${details.map(([label, value]) => `
                  <tr>
                    <th style="text-align:left;padding:0.5rem 0.75rem;color:#4e5d56;">${escapeHtml(label)}</th>
                    <td style="padding:0.5rem 0.75rem;">${escapeHtml(value || 'N/A')}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          `);
        })
        .catch(() => showToast('Error loading member', 'error'));
    }

    function editMember(id) {
      apiFetch(`/members/${id}`)
        .then(member => {
          const form = `
            <h2><i class="fas fa-user-edit"></i> Edit Member</h2>
            <form id="editMemberForm">
              <div class="form-row">
                <div class="form-group"><label>Full Name</label><input type="text" name="full_name" value="${escapeHtml(member.full_name || '')}" required></div>
                <div class="form-group"><label>Phone</label><input type="tel" name="phone" value="${escapeHtml(member.phone || '')}"></div>
              </div>
              <div class="form-row">
                <div class="form-group"><label>NIN</label><input type="text" name="nin" value="${escapeHtml(member.nin || '')}" required></div>
                <div class="form-group"><label>Status</label>
                  <select name="status">
                    ${['active', 'inactive', 'pending'].map(status => `<option value="${status}" ${status === member.status ? 'selected' : ''}>${status}</option>`).join('')}
                  </select>
                </div>
              </div>
              <div class="form-row">
                <div class="form-group"><label>Village</label><input type="text" name="village" value="${escapeHtml(member.village || '')}"></div>
                <div class="form-group"><label>District</label><input type="text" name="district" value="${escapeHtml(member.district || '')}"></div>
              </div>
              <div class="form-row">
                <div class="form-group"><label>Next of Kin Name</label><input type="text" name="next_of_kin_name" value="${escapeHtml(member.next_of_kin_name || '')}"></div>
                <div class="form-group"><label>Next of Kin Phone</label><input type="tel" name="next_of_kin_phone" value="${escapeHtml(member.next_of_kin_phone || '')}"></div>
              </div>
              <div class="form-actions">
                <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
                <button type="submit" class="btn-primary">Update</button>
              </div>
            </form>
          `;
          openModal(form);

          document.getElementById('editMemberForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const payload = Object.fromEntries(formData.entries());
            apiFetch(`/members/${id}`, {
              method: 'PUT',
              body: JSON.stringify(payload)
            }).then(data => {
              if (data.success) {
                showToast('Member updated');
                closeModal();
                loadMembers();
              } else {
                showToast(data.error || 'Update failed', 'error');
              }
            }).catch(() => showToast('Server error', 'error'));
          });
        })
        .catch(() => showToast('Error loading member', 'error'));
    }

    // ============================================================
    // INIT
    // ============================================================
    loadSaccoLogo();
    const savedUser = localStorage.getItem('user');
    if (token && savedUser) {
      currentUser = JSON.parse(savedUser);
      showApp();
    } else {
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('appShell').style.display = 'none';
    }
  </script>
</body>
</html>
