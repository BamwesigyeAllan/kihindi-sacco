<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KIHINDI SACCO – Management System</title>
  <link rel="icon" href="/icons/kihindi-sacco-logo.jpg" />
  <link rel="apple-touch-icon" href="/icons/kihindi-sacco-logo.jpg" />
  <link rel="manifest" href="/settings/manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --green-900: #0a3d2e;
      --green-800: #0d4d3d;
      --green-700: #1a6d57;
      --green-600: #2a8f74;
      --green-500: #4eaf8e;
      --gold: #d4a62a;
      --gold-deep: #b88a1f;
      --gold-light: #f2d57a;
      --bg: linear-gradient(135deg, #083e33 0%, #1c7b63 100%);
      --white: #ffffff;
      --shadow: 0 14px 32px rgba(7, 42, 33, 0.14);
      --shadow-hover: 0 20px 42px rgba(7, 42, 33, 0.18);
      --radius: 18px;
      --radius-sm: 12px;
      --border: #dfeadf;
      --text: #172a22;
      --text-muted: #5f7369;
      --font: 'Plus Jakarta Sans', sans-serif;
    }
    body {
      font-family: var(--font);
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      color: var(--text);
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-thumb { background: var(--green-800); border-radius: 10px; }

    .top-nav {
      background: var(--green-800);
      color: white;
      padding: 0.6rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 100;
      height: 70px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    }
    .top-nav .brand {
      font-size: 1.4rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .top-nav .brand i { color: var(--gold); font-size: 1.6rem; }
    .top-nav .brand span { color: var(--gold); }
    .top-nav .user-info {
      display: flex;
      align-items: center;
      gap: 1rem;
      color: white;
    }
    .top-nav .user-info .badge {
      background: var(--gold);
      color: var(--green-800);
      padding: 0.2rem 0.8rem;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
    }
    .top-nav .user-info .logout-btn {
      background: rgba(255,255,255,0.15);
      border: none;
      color: white;
      padding: 0.3rem 0.8rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-weight: 500;
      transition: 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.85rem;
    }
    .top-nav .user-info .logout-btn:hover {
      background: rgba(255,255,255,0.25);
    }

    .sidebar {
      width: 250px;
      background: var(--green-800);
      color: white;
      padding: 1.5rem 1rem;
      position: fixed;
      top: 70px;
      left: 0;
      bottom: 0;
      overflow-y: auto;
      z-index: 99;
    }
    .sidebar nav a {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0.7rem 1rem;
      color: rgba(255,255,255,0.7);
      text-decoration: none;
      border-radius: var(--radius-sm);
      transition: 0.2s;
      margin-bottom: 0.2rem;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .sidebar nav a:hover,
    .sidebar nav a.active {
      background: rgba(255,255,255,0.12);
      color: white;
    }
    .sidebar nav a.active {
      background: var(--gold);
      color: var(--green-800);
      font-weight: 600;
    }
    .sidebar nav a i { width: 20px; text-align: center; }

    .main-content {
      margin-left: 250px;
      padding: 1.5rem 2rem;
      margin-top: 70px;
      min-height: calc(100vh - 70px);
    }

    .page-header {
      margin-bottom: 1.5rem;
    }
    .page-header h1 {
      font-size: 1.6rem;
      font-weight: 600;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .page-header h1 i { color: var(--gold); }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 1.5rem;
    }
    .stat-card {
      background: var(--white);
      padding: 1.2rem 1.5rem;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      transition: 0.25s ease;
    }
    .stat-card:hover {
      box-shadow: var(--shadow-hover);
      transform: translateY(-3px);
      border-color: var(--gold);
    }
    .stat-card .stat-number {
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--green-800);
    }
    .stat-card .stat-label {
      color: var(--text-muted);
      font-size: 0.85rem;
    }
    .stat-card .stat-icon {
      float: right;
      font-size: 2rem;
      color: var(--gold-light);
    }

    .card {
      background: var(--white);
      border-radius: var(--radius);
      padding: 1.5rem;
      box-shadow: var(--shadow);
      border: 1px solid var(--border);
      margin-bottom: 1.5rem;
      transition: 0.25s ease;
    }
    .card:hover { box-shadow: var(--shadow-hover); }
    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      flex-wrap: wrap;
      gap: 0.5rem;
    }
    .card-header h2 {
      font-size: 1.1rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-header h2 i { color: var(--gold); }
    .card-header .btn {
      background: var(--green-800);
      color: white;
      border: none;
      padding: 0.4rem 1.2rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-weight: 500;
      font-size: 0.85rem;
      transition: 0.2s;
    }
    .card-header .btn:hover { background: var(--green-700); }
    .card-header .btn-gold {
      background: var(--gold);
      color: var(--green-800);
    }
    .card-header .btn-gold:hover { background: var(--gold-light); }
    .card-header .view-all {
      color: var(--gold);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .card-header .view-all:hover { text-decoration: underline; }

    .table-responsive { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; }
    table thead th {
      background: #f5f3ed;
      color: var(--text);
      font-weight: 600;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 0.6rem 0.5rem;
      text-align: left;
      border-bottom: 2px solid var(--border);
    }
    table tbody td {
      padding: 0.6rem 0.5rem;
      border-bottom: 1px solid #f5f3ec;
      font-size: 0.9rem;
    }
    table tbody tr:hover { background: #faf8f0; }

    .form-group { margin-bottom: 1rem; }
    .form-group label {
      display: block;
      font-weight: 500;
      margin-bottom: 0.2rem;
      font-size: 0.9rem;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 0.6rem 0.8rem;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.95rem;
      transition: 0.2s;
    }
    .form-group input:focus,
    .form-group select:focus {
      border-color: var(--gold);
      outline: none;
      box-shadow: 0 0 0 3px rgba(212,160,23,0.15);
    }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-actions {
      display: flex;
      gap: 1rem;
      justify-content: flex-end;
      margin-top: 1rem;
    }
    .form-actions .btn-primary {
      background: var(--green-800);
      color: white;
      border: none;
      padding: 0.6rem 2rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-weight: 600;
      transition: 0.2s;
    }
    .form-actions .btn-primary:hover { background: var(--green-700); }
    .form-actions .btn-secondary {
      background: #e8e5dd;
      color: var(--text);
      border: none;
      padding: 0.6rem 2rem;
      border-radius: var(--radius-sm);
      cursor: pointer;
      font-weight: 500;
      transition: 0.2s;
    }
    .form-actions .btn-secondary:hover { background: #d5d0c5; }
    .checkbox-group {
      display: flex;
      gap: 1.5rem;
      flex-wrap: wrap;
      align-items: center;
    }
    .checkbox-group label {
      font-weight: 400;
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.9rem;
    }
    .checkbox-group input[type="checkbox"],
    .checkbox-group input[type="radio"] {
      width: 18px;
      height: 18px;
      accent-color: var(--green-800);
    }

    .badge {
      padding: 0.15rem 0.6rem;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: capitalize;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 78px;
    }
    .badge-active { background: #dff6e7; color: #166d4c; }
    .badge-pending { background: #fff4d6; color: #8a6800; border: 1px solid #f1d67d; }
    .badge-approved { background: #e8f7ee; color: #176c46; border: 1px solid #a9d7bc; }
    .badge-rejected { background: #ffe9e8; color: #b42318; border: 1px solid #efb1aa; }

    .status-filter-group {
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }
    .status-filter {
      border: 1px solid var(--border);
      background: #f3f7f4;
      color: var(--green-800);
      border-radius: 999px;
      padding: 0.55rem 1rem;
      cursor: pointer;
      font-weight: 700;
      font-size: 0.8rem;
      transition: 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
    }
    .status-filter:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(13, 77, 61, 0.08);
    }
    .status-filter.pending { background: #fff8dc; color: #8a6800; border-color: #edd67f; }
    .status-filter.pending.active,
    .status-filter.pending:hover { background: #fbe7a1; color: #7f5a00; }
    .status-filter.approved { background: #ebf9f0; color: #166d4c; border-color: #afd9bf; }
    .status-filter.approved.active,
    .status-filter.approved:hover { background: #d8f3e1; color: #0d5d3d; }
    .status-filter.rejected { background: #fff1f0; color: #b42318; border-color: #efbbba; }
    .status-filter.rejected.active,
    .status-filter.rejected:hover { background: #ffdfe0; color: #9f221b; }

    .status-action {
      border: 1px solid transparent;
      border-radius: 999px;
      padding: 0.38rem 0.8rem;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
    }
    .status-action.approve {
      background: #eafaf0;
      color: #166d4c;
      border-color: #b8e0c4;
    }
    .status-action.approve:hover {
      background: #dff5e6;
      box-shadow: 0 6px 14px rgba(22, 109, 76, 0.12);
    }
    .status-action.reject {
      background: #fff1f0;
      color: #b42318;
      border-color: #efbcb8;
    }
    .status-action.reject:hover {
      background: #ffe3e1;
      box-shadow: 0 6px 14px rgba(180, 35, 24, 0.1);
    }
    .table-actions {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .table-action {
      border: 1px solid transparent;
      border-radius: 10px;
      padding: 0.38rem 0.8rem;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.35rem;
    }
    .table-action.view {
      background: #f2f6f4;
      color: var(--green-800);
      border-color: #dfeae3;
    }
    .table-action.view:hover {
      background: #e6f1eb;
      box-shadow: 0 6px 14px rgba(13, 77, 61, 0.08);
    }
    .table-action.edit {
      background: #f6f7f8;
      color: #2a3b34;
      border-color: #dfe5e1;
    }
    .table-action.edit:hover {
      background: #edf1f0;
      box-shadow: 0 6px 14px rgba(34, 53, 47, 0.08);
    }
    .table-action.delete {
      background: #fff1f0;
      color: #b42318;
      border-color: #f0b9b3;
    }
    .table-action.delete:hover {
      background: #ffe3e1;
      box-shadow: 0 6px 14px rgba(180, 35, 24, 0.1);
    }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 200;
      -webkit-backdrop-filter: blur(2px);
      backdrop-filter: blur(2px);
    }
    .modal.active { display: flex; }
    .modal-content {
      background: var(--white);
      padding: 2rem;
      border-radius: var(--radius);
      max-width: 600px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
      position: relative;
    }
    .modal-content .close {
      position: absolute;
      top: 1rem; right: 1.5rem;
      font-size: 1.8rem;
      cursor: pointer;
      color: #999;
      transition: 0.2s;
    }
    .modal-content .close:hover { color: #333; }
    .modal-content h2 { color: var(--green-800); margin-bottom: 1rem; }

    .photo-upload {
      border: 2px dashed var(--border);
      padding: 1rem;
      text-align: center;
      border-radius: var(--radius-sm);
      cursor: pointer;
      transition: 0.2s;
      background: #faf8f2;
    }
    .photo-upload:hover { border-color: var(--gold); background: #f5f0e6; }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      padding: 0.8rem 1.5rem;
      border-radius: var(--radius-sm);
      color: white;
      font-weight: 500;
      z-index: 999;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      animation: slideUp 0.3s ease;
      max-width: 400px;
    }
    .toast.success { background: var(--green-800); }
    .toast.error { background: #c0392b; }
    .toast.info { background: #2980b9; }
    @keyframes slideUp {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .login-container {
      max-width: 400px;
      margin: 2rem auto;
      background: var(--white);
      padding: 2.5rem;
      border-radius: var(--radius);
      box-shadow: 0 20px 60px rgba(0,0,0,0.1);
    }
    .login-container h1 {
      color: var(--green-800);
      text-align: center;
      margin-bottom: 0.2rem;
    }
    .login-container .motto {
      color: var(--gold);
      text-align: center;
      font-style: italic;
      margin-bottom: 1.5rem;
    }
    .login-container .form-group { margin-bottom: 1rem; }
    .login-container .btn {
      width: 100%;
      padding: 0.8rem;
      background: var(--green-800);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }
    .login-container .btn:hover { background: var(--green-700); }

    @media (max-width: 768px) {
      .sidebar { width: 200px; }
      .main-content { margin-left: 200px; padding: 1rem; }
      .top-nav { padding: 0.4rem 1rem; }
      .top-nav .brand { font-size: 1.2rem; }
      .form-row { grid-template-columns: 1fr; }
      .stats-grid { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 576px) {
      .sidebar { width: 180px; }
      .main-content { margin-left: 180px; padding: 0.8rem; }
      .stats-grid { grid-template-columns: 1fr; }
    }

    /* Modern cooperative dashboard */
    :root {
      --green-900: #0a3d2e;
      --green-800: #0d4d3d;
      --green-700: #1a6d57;
      --green-600: #2a8f74;
      --gold: #d4a62a;
      --gold-light: #f2d57a;
      --bg: linear-gradient(135deg, #083e33 0%, #1c7b63 100%);
      --border: #dfeadf;
      --text: #172a22;
      --text-muted: #6d7c74;
      --shadow: 0 8px 24px rgba(10, 61, 46, 0.06);
      --shadow-hover: 0 14px 32px rgba(10, 61, 46, 0.1);
      --radius: 18px;
      --radius-sm: 11px;
    }
    body { background: var(--bg); }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-thumb { background: #d5e1da; border-radius: 10px; }
    ::-webkit-scrollbar-thumb:hover { background: #a9bcaf; }
    .top-nav {
      position: fixed;
      inset: 0 0 auto;
      height: 72px;
      padding: 0 2rem;
      background: rgba(255,255,255,0.96);
      color: var(--text);
      border-bottom: 1px solid var(--border);
      box-shadow: 0 3px 16px rgba(20, 50, 38, 0.035);
      -webkit-backdrop-filter: blur(14px);
      backdrop-filter: blur(14px);
    }
    .top-nav .brand { color: var(--green-900); letter-spacing: -0.04em; }
    .top-nav .brand i { color: var(--green-700); }
    .top-nav .brand span { color: var(--green-700); }
    .top-nav .user-info { gap: 0.75rem; color: var(--text); }
    .top-nav .user-info .badge {
      background: #edf5f0;
      color: var(--green-800);
      padding: 0.35rem 0.7rem;
      letter-spacing: 0.04em;
    }
    .top-nav .user-info .logout-btn {
      background: #f4f7f5;
      color: var(--text);
      padding: 0.55rem 0.85rem;
      border: 1px solid var(--border);
    }
    .top-nav .user-info .logout-btn:hover { background: #eaf1ed; }
    .sidebar {
      top: 72px;
      width: 258px;
      padding: 1.5rem 1rem;
      background: #fff;
      color: var(--text);
      border-right: 1px solid var(--border);
    }
    .sidebar nav::before {
      content: 'WORKSPACE';
      display: block;
      padding: 0.25rem 0.9rem 0.8rem;
      color: #99a79f;
      font-size: 0.67rem;
      font-weight: 800;
      letter-spacing: 0.13em;
    }
    .sidebar nav a {
      padding: 0.78rem 0.9rem;
      margin-bottom: 0.35rem;
      color: #68786f;
      font-size: 0.86rem;
      font-weight: 600;
    }
    .sidebar nav a:hover,
    .sidebar nav a.active {
      background: #eff6f1;
      color: var(--green-800);
    }
    .sidebar nav a.active {
      box-shadow: inset 3px 0 0 var(--green-700);
      font-weight: 700;
    }
    .sidebar nav a i { color: #80958a; }
    .sidebar nav a.active i { color: var(--green-700); }
    .main-content {
      margin: 72px 0 0 258px;
      padding: 2rem clamp(1.25rem, 3vw, 2.75rem);
      min-height: calc(100vh - 72px);
    }
    .page-header { margin-bottom: 1.5rem; }
    .page-header h1 { font-size: 1.55rem; font-weight: 750; letter-spacing: -0.04em; }
    .page-header h1 i { color: var(--green-700); }
    .stats-grid { gap: 1rem; margin-bottom: 1.25rem; }
    .stat-card {
      position: relative;
      overflow: hidden;
      min-height: 150px;
      padding: 1.2rem 1.25rem;
      border: 1px solid #e8eeea;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .stat-card::after {
      content: '';
      position: absolute;
      width: 100px;
      height: 100px;
      right: -36px;
      bottom: -46px;
      border-radius: 50%;
      background: #f2f7f3;
      pointer-events: none;
    }
    .stat-card:hover { border-color: #d5e5da; }
    .stat-card .stat-icon {
      float: none;
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      margin-bottom: 1rem;
      border-radius: 13px;
      background: #edf5f0;
      color: var(--green-700);
      font-size: 1.05rem;
    }
    .stat-card:nth-child(2) .stat-icon { background: #fdf5df; color: #b58a25; }
    .stat-card:nth-child(3) .stat-icon { background: #eef2fb; color: #6177b7; }
    .stat-card:nth-child(4) .stat-icon { background: #f9eeee; color: #b16d63; }
    .stat-card .stat-number {
      position: relative;
      z-index: 1;
      margin-bottom: 0.25rem;
      color: var(--text);
      font-size: clamp(1.25rem, 2vw, 1.65rem);
      letter-spacing: -0.045em;
      overflow-wrap: anywhere;
    }
    .stat-card .stat-label { position: relative; z-index: 1; font-size: 0.79rem; font-weight: 600; }
    .card {
      padding: 1.35rem;
      border: 1px solid #e8eeea;
      border-radius: var(--radius);
      box-shadow: var(--shadow);
    }
    .card-header h2 { color: var(--text); font-size: 1rem; font-weight: 750; }
    .card-header h2 i { color: var(--green-700); }
    .card-header .view-all { color: var(--green-700); font-weight: 700; }
    table thead th {
      background: #f7f9f8;
      color: #819087;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      padding: 0.8rem 0.7rem;
      border-bottom: 1px solid var(--border);
    }
    table tbody td { padding: 0.85rem 0.7rem; border-bottom-color: #eef2ef; }
    table tbody tr:hover { background: #f8fbf9; }
    .dashboard-intro {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.35rem;
    }
    .dashboard-intro .eyebrow {
      margin-bottom: 0.4rem;
      color: var(--green-700);
      font-size: 0.68rem;
      font-weight: 800;
      letter-spacing: 0.14em;
    }
    .dashboard-intro h1 {
      color: var(--text);
      font-size: clamp(1.55rem, 3vw, 2rem);
      font-weight: 800;
      letter-spacing: -0.055em;
    }
    .dashboard-intro p { margin-top: 0.35rem; color: var(--text-muted); font-size: 0.88rem; }
    .dashboard-date {
      flex: 0 0 auto;
      padding: 0.65rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      color: #62746a;
      font-size: 0.78rem;
      font-weight: 650;
    }
    .dashboard-actions {
      display: grid !important;
      grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)) !important;
      gap: 0.75rem !important;
    }
    .dashboard-actions .btn,
    .dashboard-actions .btn-gold {
      min-height: 46px;
      padding: 0.7rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #fff;
      color: var(--green-800);
      text-align: left;
      font-size: 0.82rem;
      font-weight: 700;
      box-shadow: 0 2px 5px rgba(20,50,38,0.025);
      cursor: pointer;
    }
    .dashboard-actions .btn:hover,
    .dashboard-actions .btn-gold:hover {
      border-color: #cbded1;
      background: #f4f9f5;
      transform: translateY(-1px);
    }
    .dashboard-actions .btn i { margin-right: 0.4rem; color: var(--green-700); }
    .activity-card .card-header { margin-bottom: 0.5rem; }
    .activity-card .card-subtitle { margin-top: 0.25rem; color: var(--text-muted); font-size: 0.78rem; }
    .activity-card .empty-state { padding: 1.5rem; text-align: center; color: var(--text-muted); }
    .login-container {
      border: 1px solid rgba(255,255,255,0.75);
      border-radius: 22px;
      box-shadow: 0 24px 70px rgba(22, 54, 39, 0.13);
    }
    .brand-logo {
      width: 42px;
      height: 42px;
      flex: 0 0 auto;
      object-fit: contain;
      border-radius: 50%;
      background: #fffdf5;
      box-shadow: 0 2px 8px rgba(17, 43, 31, 0.12);
    }
    .logo-settings-nav { display: none; }
    .login-logo {
      display: block;
      width: min(220px, 75%);
      aspect-ratio: 1;
      object-fit: contain;
      margin: 0 auto 1rem;
    }
    .login-container h1 { letter-spacing: -0.04em; }
    .receipt {
      max-width: 540px;
      margin: 0 auto;
      padding: 1rem;
      color: #172a22;
      font-family: Arial, sans-serif;
    }
    .receipt-header {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding-bottom: 1rem;
      border-bottom: 2px solid #d5a20a;
    }
    .receipt-logo { width: 88px; height: 88px; object-fit: contain; flex: 0 0 auto; }
    .receipt-header h2 { margin: 0 0 0.25rem; color: #174a38; font-size: 1.05rem; }
    .receipt-header p { color: #66766d; font-size: 0.8rem; }
    .receipt-title { margin: 1.1rem 0; color: #174a38; text-align: center; letter-spacing: 0.12em; }
    .receipt-details { width: 100%; border-collapse: collapse; }
    .receipt-details th, .receipt-details td { padding: 0.7rem 0.4rem; border-bottom: 1px solid #e5ece8; text-align: left; }
    .receipt-details th { width: 42%; color: #74847c; font-size: 0.82rem; font-weight: 600; }
    .receipt-details td { font-weight: 700; overflow-wrap: anywhere; }
    .receipt-signatures { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-top: 2.5rem; }
    .receipt-signatures div { padding-top: 0.5rem; border-top: 1px solid #88968e; color: #66766d; font-size: 0.75rem; }
    .receipt-note { margin-top: 1.5rem; color: #74847c; text-align: center; font-size: 0.75rem; }
    @media print {
      body * { visibility: hidden !important; }
      #modal.active, #modal.active * { visibility: visible !important; }
      #modal.active {
        display: block !important;
        position: absolute;
        inset: 0;
        width: 100%;
        height: auto;
        padding: 0;
        background: #fff;
        -webkit-backdrop-filter: none;
        backdrop-filter: none;
      }
      #modal.active .modal-content {
        width: 100%;
        max-width: none;
        max-height: none;
        padding: 0;
        overflow: visible;
        border-radius: 0;
        box-shadow: none;
      }
      .receipt-actions, .modal-content .close { display: none !important; }
    }
    #loginScreen {
      background: radial-gradient(circle at 15% 20%, rgba(46,130,88,0.1), transparent 28%),
                  radial-gradient(circle at 90% 85%, rgba(213,168,59,0.12), transparent 27%),
                  var(--bg);
    }
    @media (max-width: 768px) {
      .top-nav { height: 64px; padding: 0 1rem; }
      .top-nav .brand { font-size: 1.08rem; }
      .sidebar { top: 64px; width: 210px; }
      .main-content { margin: 64px 0 0 210px; padding: 1.25rem 1rem; }
      .stats-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .top-nav .user-info { gap: 0.4rem; }
      .top-nav .user-info .logout-btn { padding: 0.48rem 0.6rem; }
    }
    @media (max-width: 576px) {
      .top-nav { height: 60px; }
      .top-nav .brand { font-size: 0.95rem; gap: 6px; }
      .top-nav .brand i { font-size: 1.2rem; }
      .top-nav .user-info > span:first-child { display: none; }
      .top-nav .user-info .badge { font-size: 0.62rem; padding: 0.3rem 0.5rem; }
      .top-nav .user-info .logout-btn { font-size: 0; gap: 0; }
      .top-nav .user-info .logout-btn i { font-size: 0.9rem; }
      .sidebar { top: 60px; width: 68px; padding: 1rem 0.5rem; }
      .sidebar nav::before { padding: 0.25rem 0 0.7rem; font-size: 0; }
      .sidebar nav a { justify-content: center; gap: 0; padding: 0.78rem 0.25rem; font-size: 0; }
      .sidebar nav a i { width: auto; font-size: 1rem; }
      .main-content { margin: 60px 0 0 68px; padding: 1rem 0.75rem; }
      .stats-grid { grid-template-columns: 1fr 1fr; gap: 0.65rem; }
      .stat-card { min-height: 135px; padding: 0.9rem; }
      .stat-card .stat-icon { width: 36px; height: 36px; margin-bottom: 0.75rem; }
      .stat-card .stat-label { font-size: 0.7rem; }
      .dashboard-intro { align-items: flex-start; flex-direction: column; }
      .dashboard-date { padding: 0.5rem 0.7rem; }
      .card { padding: 1rem; }
      .card-header { align-items: flex-start; }
    }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" style="display:flex; justify-content:center; align-items:center; min-height:100vh;">
    <div class="login-container">
      <img class="login-logo" src="/icons/kihindi-sacco-logo.jpg" alt="Mbarara City Kihindi Boda Rider's SACCO logo" />
      <h1>KIHINDI SACCO</h1>
      <div class="motto">Faith in God Leads to Success</div>
      <form id="loginForm">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="loginUsername" placeholder="Enter username" />
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="Enter password" />
        </div>
        <button class="btn" type="submit">Login</button>
      </form>
      <p style="text-align:center;color:#888;font-size:0.8rem;margin-top:1rem;">
        Use your credentials provided by the SACCO.
      </p>
    </div>
  </div>

  <!-- APP SHELL -->
  <div id="appShell" style="display:none;">
    <!-- TOP NAVBAR -->
    <nav class="top-nav">
      <div class="brand">
        <img class="brand-logo" src="/icons/kihindi-sacco-logo.jpg" alt="" />
        <span>KIHINDI</span> SACCO
      </div>
      <div class="user-info" id="userInfo">
        <span class="badge" id="userRole">ADMIN</span>
        <button class="logout-btn" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </nav>

    <!-- SIDEBAR -->
    <aside class="sidebar" id="sidebar">
      <nav>
        <a class="active" data-page="dashboard"><i class="fas fa-chart-pie"></i> Dashboard</a>
        <a data-page="members"><i class="fas fa-users"></i> Members</a>
        <a data-page="member-applications"><i class="fas fa-file-signature"></i> Member Applications</a>
        <a data-page="loan-applications"><i class="fas fa-file-invoice"></i> Loan Applications</a>
        <a data-page="savings"><i class="fas fa-piggy-bank"></i> Savings</a>
        <a data-page="deposits"><i class="fas fa-file-invoice"></i> Fixed Deposits</a>
        <a data-page="loans"><i class="fas fa-hand-holding-usd"></i> Loans</a>
        <a data-page="reports"><i class="fas fa-flag"></i> Reports</a>
        <a data-page="staff"><i class="fas fa-user-cog"></i> Staff Access</a>
        <a data-page="logo-settings" id="logoSettingsNav" class="logo-settings-nav"><i class="fas fa-image"></i> SACCO Logo</a>
        <a onclick="logout()" style="margin-top:1rem; border-top:1px solid rgba(255,255,255,0.1); padding-top:1rem;">
          <i class="fas fa-sign-out-alt"></i> Logout
        </a>
      </nav>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="main-content" id="mainContent">
      <!-- Pages injected here -->
    </div>
  </div>

  <!-- MODAL -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <span class="close" onclick="closeModal()">&times;</span>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toast" class="toast" style="display:none;"></div>

  <script>
    // ============================================================
    // GLOBALS
    // ============================================================
    let token = localStorage.getItem('token');
    let currentUser = null;
    let charts = {};
    let allMembers = [];
    let allLoans = [];
    let saccoLogoUrl = '/icons/kihindi-sacco-logo.jpg';

    // ============================================================
    // AUTH
    // ============================================================
    document.getElementById('loginForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const username = document.getElementById('loginUsername').value;
      const password = document.getElementById('loginPassword').value;
      login(username, password);
    });

    function login(username, password) {
      fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password })
      })
      .then(res => res.json())
      .then(data => {
        if (data.token) {
          token = data.token;
          localStorage.setItem('token', token);
          currentUser = data.user;
          localStorage.setItem('user', JSON.stringify(currentUser));
          showApp();
        } else {
          showToast(data.error || 'Login failed', 'error');
        }
      })
      .catch(() => showToast('Server error', 'error'));
    }

    function logout() {
      localStorage.removeItem('token');
      localStorage.removeItem('user');
      token = null;
      currentUser = null;
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('appShell').style.display = 'none';
    }

    function showApp() {
      const userRoleEl = document.getElementById('userRole');

      document.getElementById('loginScreen').style.display = 'none';
      document.getElementById('appShell').style.display = 'block';
      userRoleEl.textContent = (currentUser.role || '').toUpperCase();
      document.getElementById('logoSettingsNav').style.display = ['admin', 'chairperson'].includes(getUserRole()) ? 'flex' : 'none';
      loadSaccoLogo();
      loadPage('dashboard');
    }

    function loadSaccoLogo() {
      fetch('/settings/logo', { headers: { 'Authorization': `Bearer ${token}` } })
        .then(res => res.ok ? res.json() : null)
        .then(data => {
          if (data?.logoUrl) {
            saccoLogoUrl = data.logoUrl;
            document.querySelectorAll('.login-logo, .brand-logo, .receipt-logo').forEach(image => {
              image.src = saccoLogoUrl;
            });
            document.querySelectorAll('link[rel="icon"], link[rel="apple-touch-icon"]').forEach(link => {
              link.href = saccoLogoUrl;
            });
          }
        })
        .catch(() => {});
    }

    // ============================================================
    // API HELPER
    // ============================================================
    function apiFetch(endpoint, options = {}) {
      return fetch(endpoint, {
        ...options,
        headers: {
          'Content-Type': 'application/json',
          'Authorization': `Bearer ${token}`,
          ...options.headers
        }
      }).then(res => {
        if (res.status === 401) { logout(); throw new Error('Session expired'); }
        return res.json();
      });
    }

    // ============================================================
    // NAVIGATION
    // ============================================================
    document.querySelectorAll('.sidebar nav a[data-page]').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const page = link.dataset.page;
        loadPage(page);
      });
    });

    function loadPage(page) {
      document.querySelectorAll('.sidebar nav a[data-page]').forEach(a => a.classList.remove('active'));
      document.querySelector(`.sidebar nav a[data-page="${page}"]`)?.classList.add('active');

      switch(page) {
        case 'dashboard': loadDashboard(); break;
        case 'members': loadMembers(); break;
        case 'member-applications': loadMemberApplications(); break;
        case 'loan-applications': loadLoanApplications(); break;
        case 'savings': loadSavings(); break;
        case 'deposits': loadDeposits(); break;
        case 'loans': loadLoans(); break;
        case 'reports': loadReports(); break;
        case 'staff': loadStaff(); break;
        case 'logo-settings': loadLogoSettings(); break;
        default: document.getElementById('mainContent').innerHTML = '<p>Page not found</p>';
      }
    }

    // ============================================================
    // TOAST & MODAL
    // ============================================================
    function showToast(message, type = 'success') {
      const toast = document.getElementById('toast');
      toast.textContent = message;
      toast.className = `toast ${type}`;
      toast.style.display = 'block';
      setTimeout(() => { toast.style.display = 'none'; }, 4000);
    }

    function openModal(html) {
      document.getElementById('modalBody').innerHTML = html;
      document.getElementById('modal').classList.add('active');
    }
    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, character => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[character]);
    }

    function showWithdrawalReceipt(data) {
      const receipt = data.receipt || {};
      const amount = Number(receipt.amount || 0).toLocaleString('en-UG');
      openModal(`
        <article class="receipt">
          <header class="receipt-header">
            <img class="receipt-logo" src="${escapeHtml(saccoLogoUrl)}" alt="Mbarara City Kihindi Boda Rider's SACCO logo" />
            <div>
              <h2>MBARARA CITY KIHINDI BODA RIDER'S SACCO</h2>
              <p>Faith in God Leads to Success</p>
            </div>
          </header>
          <h3 class="receipt-title">SAVINGS WITHDRAWAL RECEIPT</h3>
          <table class="receipt-details">
            <tbody>
              <tr><th>Receipt number</th><td>${escapeHtml(data.receipt_no)}</td></tr>
              <tr><th>Member name</th><td>${escapeHtml(receipt.member_name)}</td></tr>
              <tr><th>Account number</th><td>${escapeHtml(receipt.account_no)}</td></tr>
              <tr><th>National ID</th><td>${escapeHtml(receipt.national_id)}</td></tr>
              <tr><th>Withdrawal date</th><td>${escapeHtml(receipt.date)}</td></tr>
              <tr><th>Amount paid</th><td>UGX ${amount}</td></tr>
              <tr><th>New account balance</th><td>UGX ${Number(data.newBalance || 0).toLocaleString('en-UG')}</td></tr>
            </tbody>
          </table>
          <div class="receipt-signatures">
            <div>Member's signature</div>
            <div>Cashier's signature</div>
          </div>
          <p class="receipt-note">Thank you for banking with Kihindi SACCO.</p>
          <div class="form-actions receipt-actions">
            <button type="button" class="btn-secondary" onclick="closeModal()">Close</button>
            <button type="button" class="btn-primary" onclick="window.print()"><i class="fas fa-print"></i> Print receipt</button>
          </div>
        </article>
      `);
    }

    function getUserRole() {
      return currentUser ? currentUser.role : null;
    }
    function isAdmin() {
      return ['admin', 'chairperson', 'chairman'].includes(getUserRole());
    }

    // ============================================================
    // DASHBOARD
    // ============================================================
    function loadDashboard() {
      const role = getUserRole();
      let quickActions = '';
      let stats = '';

      apiFetch('/reports/dashboard')
        .then(data => {
          const today = new Date().toLocaleDateString(undefined, {
            weekday: 'long', year: 'numeric', month: 'long', day: 'numeric'
          });
          stats = `
            <div class="stats-grid">
              <div class="stat-card">
                <i class="fas fa-user-friends stat-icon"></i>
                <div class="stat-number">${data.totalMembers || 0}</div>
                <div class="stat-label">Active members</div>
              </div>
              <div class="stat-card">
                <i class="fas fa-piggy-bank stat-icon"></i>
                <div class="stat-number">UGX ${Number(data.totalSavings || 0).toLocaleString()}</div>
                <div class="stat-label">Total savings</div>
              </div>
              <div class="stat-card">
                <i class="fas fa-coins stat-icon"></i>
                <div class="stat-number">UGX ${Number(data.totalDeposits || 0).toLocaleString()}</div>
                <div class="stat-label">Fixed deposits</div>
              </div>
              <div class="stat-card">
                <i class="fas fa-hand-holding-usd stat-icon"></i>
                <div class="stat-number">UGX ${Number(data.outstandingLoans || 0).toLocaleString()}</div>
                <div class="stat-label">Outstanding loans</div>
              </div>
            </div>
          `;

          if (role === 'admin' || role === 'chairman') {
            quickActions = `
              <div class="card">
                <div class="card-header">
                  <div>
                    <h2><i class="fas fa-bolt"></i> Quick actions</h2>
                    <p class="card-subtitle">Common tasks, one click away</p>
                  </div>
                </div>
                <div class="dashboard-actions">
                  <button class="btn" onclick="loadPage('members')"><i class="fas fa-user-plus"></i> Register Member</button>
                  <button class="btn btn-gold" onclick="loadPage('member-applications')"><i class="fas fa-file-signature"></i> Review Applications</button>
                  <button class="btn" onclick="loadPage('loan-applications')"><i class="fas fa-file-invoice"></i> Review Loans</button>
                </div>
              </div>
            `;
          } else if (role === 'loan_officer') {
            quickActions = `
              <div class="card">
                <div class="card-header">
                  <div>
                    <h2><i class="fas fa-bolt"></i> Quick actions</h2>
                    <p class="card-subtitle">Shortcuts for your daily workflow</p>
                  </div>
                </div>
                <div class="dashboard-actions">
                  <button class="btn" onclick="loadPage('loans')"><i class="fas fa-hand-holding-usd"></i> Manage Loans</button>
                  <button class="btn btn-gold" onclick="loadPage('loan-applications')"><i class="fas fa-file-invoice"></i> Review Applications</button>
                </div>
              </div>
            `;
          } else if (role === 'cashier') {
            quickActions = `
              <div class="card">
                <div class="card-header">
                  <div>
                    <h2><i class="fas fa-bolt"></i> Quick actions</h2>
                    <p class="card-subtitle">Shortcuts for your daily workflow</p>
                  </div>
                </div>
                <div class="dashboard-actions">
                  <button class="btn" onclick="loadPage('savings')"><i class="fas fa-piggy-bank"></i> Savings Deposit</button>
                  <button class="btn btn-gold" onclick="loadPage('savings')"><i class="fas fa-minus"></i> Withdraw</button>
                </div>
              </div>
            `;
          }

          let recentHtml = `
            <div class="card activity-card">
              <div class="card-header">
                <div>
                  <h2><i class="fas fa-clock"></i> Recent transactions</h2>
                  <p class="card-subtitle">The latest activity across your cooperative</p>
                </div>
                <a href="#" class="view-all" onclick="loadPage('reports'); return false;">View reports <i class="fas fa-arrow-right"></i></a>
              </div>
              <div class="table-responsive">
                <table>
                  <thead><tr><th>Date</th><th>Member</th><th>Transaction</th><th>Amount</th></tr></thead>
                  <tbody>
                    ${data.recentTransactions && data.recentTransactions.length ? data.recentTransactions.map(t => `
                      <tr><td>${t.created_at}</td><td>${t.Member?.full_name || 'N/A'}</td><td>${t.type}</td><td><strong>UGX ${Number(t.amount).toLocaleString()}</strong></td></tr>
                    `).join('') : '<tr><td colspan="4" class="empty-state">No transactions to show yet</td></tr>'}
                  </tbody>
                </table>
              </div>
            </div>
          `;

          document.getElementById('mainContent').innerHTML = `
            <div class="dashboard-intro">
              <div>
                <div class="eyebrow">KIHINDI SACCO · OVERVIEW</div>
                <h1>Your cooperative at a glance</h1>
                <p>Track your portfolio and stay on top of daily operations.</p>
              </div>
              <div class="dashboard-date"><i class="far fa-calendar-alt"></i> ${today}</div>
            </div>
            ${stats}
            ${quickActions}
            ${recentHtml}
          `;
        })
        .catch(() => showToast('Error loading dashboard', 'error'));
    }

    // ============================================================
    // MEMBERS
    // ============================================================
    function loadMembers() {
      apiFetch('/members')
        .then(data => {
          allMembers = data;
          let rows = data.map(m => `
            <tr>
              <td>${m.membership_no}</td>
              <td>${m.full_name}</td>
              <td>${m.nin}</td>
              <td>${m.phone}</td>
              <td><span class="badge badge-${m.status}">${m.status}</span></td>

        .catch(() => showToast('Error loading loans', 'error'));
    }

    function repayLoan(loanId) {
      const amount = prompt('Enter repayment amount:');
      if (!amount) return;
      apiFetch(`/loans/${loanId}/repay`, {
        method: 'POST',
        body: JSON.stringify({ amount_paid: parseFloat(amount), payment_mode: 'cash' })
      })
      .then(data => {
        if (data.success) {
          showToast('Repayment recorded!');
          loadLoans();
        } else {
          showToast(data.error || 'Failed', 'error');
        }
      })
      .catch(() => showToast('Server error', 'error'));
    }

    // ============================================================
    // REPORTS
    // ============================================================
    function loadReports() {
      // Similar to previous – reuse
      apiFetch('/reports/dashboard')
        .then(data => {
          let html = `
            <div class="page-header"><h1><i class="fas fa-flag"></i> Reports</h1></div>
            <div class="stats-grid">
              <div class="stat-card"><div class="stat-number">${data.totalMembers || 0}</div><div class="stat-label">Members</div></div>
              <div class="stat-card"><div class="stat-number">UGX ${Number(data.totalSavings || 0).toLocaleString()}</div><div class="stat-label">Savings</div></div>
              <div class="stat-card"><div class="stat-number">UGX ${Number(data.totalDeposits || 0).toLocaleString()}</div><div class="stat-label">Fixed Deposits</div></div>
              <div class="stat-card"><div class="stat-number">UGX ${Number(data.outstandingLoans || 0).toLocaleString()}</div><div class="stat-label">Loans</div></div>
            </div>
            <div class="card">
              <div class="card-header">
                <h2><i class="fas fa-chart-bar"></i> Analytics</h2>
                <div>
                  <button class="btn" onclick="exportReport('pdf')"><i class="fas fa-file-pdf"></i> PDF</button>
                  <button class="btn btn-gold" onclick="exportReport('excel')"><i class="fas fa-file-excel"></i> Excel</button>
                </div>
              </div>
              <div style="display:grid; grid-template-columns:1fr 1fr; gap:1.5rem; margin-top:1rem;">
                <div style="background:#faf8f2; padding:1rem; border-radius:var(--radius-sm);">
                  <h4 style="margin-bottom:0.5rem;">Deposits by Month</h4>
                  <canvas id="depositsChart" height="180"></canvas>
                </div>
                <div style="background:#faf8f2; padding:1rem; border-radius:var(--radius-sm);">
                  <h4 style="margin-bottom:0.5rem;">Loans by Product</h4>
                  <canvas id="loansChart" height="180"></canvas>
                </div>
              </div>
            </div>
          `;
          document.getElementById('mainContent').innerHTML = html;
          loadCharts();
        })
        .catch(() => showToast('Error loading reports', 'error'));
    }

    function loadCharts() {
      // Same as earlier – you can reuse the full implementation
    }

    function exportReport(type) {
      showToast(`Exporting ${type} report... (Demo)`, 'info');
    }

    // ============================================================
    // STAFF
    // ============================================================
    function loadLogoSettings() {
      document.getElementById('mainContent').innerHTML = `
        <div class="page-header"><h1><i class="fas fa-image"></i> SACCO Logo</h1></div>
        <div class="card" style="max-width:680px;">
          <div class="card-header">
            <div>
              <h2>Update your SACCO logo</h2>
              <p class="card-subtitle">Choose an image from your computer, including your Downloads folder.</p>
            </div>
          </div>
          <form id="logoUploadForm">
            <div class="form-group" style="text-align:center;">
              <img id="logoPreview" src="${escapeHtml(saccoLogoUrl)}" alt="Current SACCO logo" style="width:180px;height:180px;object-fit:contain;margin:0 auto 1rem;border:1px solid var(--border);border-radius:12px;padding:0.5rem;background:#fff;" />
              <label for="logoFile" style="display:block;text-align:left;">Select logo image</label>
              <input id="logoFile" name="logo" type="file" accept=".png,.jpg,.jpeg,.webp,image/png,image/jpeg,image/webp" required />
              <small style="display:block;text-align:left;color:var(--text-muted);margin-top:0.4rem;">PNG, JPG, or WebP · Maximum 5 MB</small>
            </div>
            <div class="form-actions">
              <button type="submit" class="btn-primary"><i class="fas fa-upload"></i> Upload logo</button>
            </div>
          </form>
        </div>
      `;

      const fileInput = document.getElementById('logoFile');
      fileInput.addEventListener('change', () => {
        const file = fileInput.files[0];
        if (file) document.getElementById('logoPreview').src = URL.createObjectURL(file);
      });

      document.getElementById('logoUploadForm').addEventListener('submit', async (event) => {
        event.preventDefault();
        const formData = new FormData(event.currentTarget);
        try {
          const response = await fetch('/settings/logo', {
            method: 'POST',
            headers: { 'Authorization': `Bearer ${token}` },
            body: formData
          });
          const data = await response.json();
          if (!response.ok || !data.success) throw new Error(data.error || 'Logo upload failed');
          saccoLogoUrl = data.logoUrl;
          document.querySelectorAll('.login-logo, .brand-logo, .receipt-logo').forEach(image => {
            image.src = saccoLogoUrl;
          });
          document.querySelectorAll('link[rel="icon"], link[rel="apple-touch-icon"]').forEach(link => {
            link.href = saccoLogoUrl;
          });
          showToast('SACCO logo updated successfully');
          loadLogoSettings();
        } catch (error) {
          showToast(error.message || 'Logo upload failed', 'error');
        }
      });
    }

    function loadStaff() {
      if (!isAdmin()) {
        showToast('Permission denied.', 'error');
        loadPage('dashboard');
        return;
      }
      apiFetch('/users')
        .then(data => {
          let rows = data.map(u => `
            <tr>
              <td>${u.id}</td>
              <td>${u.username && u.username.toLowerCase() === 'admin' ? 'System' : u.username}</td>
              <td>${u.role}</td>
              <td>
                <div class="table-actions">
                  <button class="table-action edit" onclick="editUser(${u.id})"><i class="fas fa-pen"></i> Edit</button>
                  <button class="table-action delete" onclick="deleteUser(${u.id})"><i class="fas fa-trash"></i> Delete</button>
                </div>
              </td>
            </tr>
          `).join('');
          let html = `
            <div class="page-header"><h1><i class="fas fa-user-cog"></i> Staff Access</h1></div>
            <div class="card">
              <div class="card-header">
                <h2>Staff Members</h2>
                <button class="btn" onclick="openUserForm()"><i class="fas fa-plus"></i> Add Staff</button>
              </div>
              <div class="table-responsive">
                <table>
                  <thead><tr><th>ID</th><th>Username</th><th>Role</th><th>Action</th></tr></thead>
                  <tbody>${rows || '<tr><td colspan="4" style="text-align:center;color:#999;">No staff</td></tr>'}</tbody>
                </table>
              </div>
            </div>
          `;
          document.getElementById('mainContent').innerHTML = html;
        })
        .catch(() => showToast('Error loading staff', 'error'));
    }

    function openUserForm() {
      const form = `
        <h2><i class="fas fa-user-plus"></i> Add Staff</h2>
        <form id="userForm">
          <div class="form-group"><label>Username</label><input type="text" name="username" required></div>
          <div class="form-group"><label>Password</label><input type="password" name="password" required></div>
          <div class="form-group"><label>Role</label>
            <select name="role">
              <option value="admin">Admin</option>
              <option value="chairman">Chairman</option>
              <option value="loan_officer">Loan Officer</option>
              <option value="cashier">Cashier</option>
            </select>
          </div>
          <div class="form-actions">
            <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
            <button type="submit" class="btn-primary">Save</button>
          </div>
        </form>
      `;
      openModal(form);
      document.getElementById('userForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const formData = new FormData(this);
        const obj = {};
        formData.forEach((v,k) => obj[k] = v);
        apiFetch('/users', { method: 'POST', body: JSON.stringify(obj) })
          .then(data => {
            if (data.success) {
              showToast('Staff added!');
              closeModal();
              loadStaff();
            } else {
              showToast(data.error || 'Failed', 'error');
            }
          })
          .catch(() => showToast('Server error', 'error'));
      });
    }

    function editUser(id) {
      apiFetch(`/users/${id}`)
        .then(user => {
          const form = `
            <h2><i class="fas fa-user-edit"></i> Edit Staff</h2>
            <form id="editUserForm">
              <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" value="${escapeHtml(user.username)}" required>
              </div>
              <div class="form-group">
                <label>Role</label>
                <select name="role">
                  ${['admin', 'chairman', 'loan_officer', 'cashier'].map(role => `
                    <option value="${role}" ${role === user.role ? 'selected' : ''}>${role.replace('_', ' ')}</option>
                  `).join('')}
                </select>
              </div>
              <div class="form-group">
                <label>New Password (optional)</label>
                <input type="password" name="password" placeholder="Leave blank to keep current password">
              </div>
              <div class="form-actions">
                <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
                <button type="submit" class="btn-primary">Update</button>
              </div>
            </form>
          `;
          openModal(form);

          document.getElementById('editUserForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const payload = { username: formData.get('username'), role: formData.get('role') };
            const password = String(formData.get('password') || '').trim();
            if (password) payload.password = password;

            apiFetch(`/users/${id}`, {
              method: 'PUT',
              body: JSON.stringify(payload)
            }).then(data => {
              if (data.success) {
                showToast('Staff updated');
                closeModal();
                loadStaff();
              } else {
                showToast(data.error || 'Update failed', 'error');
              }
            }).catch(() => showToast('Server error', 'error'));
          });
        })
        .catch(() => showToast('Error loading user', 'error'));
    }

    function deleteUser(id) {
      if (!confirm('Delete this user?')) return;
      apiFetch(`/users/${id}`, { method: 'DELETE' })
        .then(data => {
          if (data.success) {
            showToast('User deleted');
            loadStaff();
          } else {
            showToast(data.error || 'Failed', 'error');
          }
        });
    }

    // ============================================================
    // VIEW / EDIT MEMBER
    // ============================================================
    function viewMember(id) {
      apiFetch(`/members/${id}`)
        .then(member => {
          const details = [
            ['Membership No', member.membership_no],
            ['Full name', member.full_name],
            ['NIN', member.nin],
            ['Phone', member.phone],
            ['Status', member.status],
            ['Address', [member.village, member.parish, member.sub_county, member.district].filter(Boolean).join(', ') || 'N/A'],
            ['Next of kin', member.next_of_kin_name],
            ['Next of kin phone', member.next_of_kin_phone]
          ];

          openModal(`
            <h2><i class="fas fa-user"></i> Member Details</h2>
            <table style="width:100%;border-collapse:collapse;">
              <tbody>
                ${details.map(([label, value]) => `
                  <tr>
                    <th style="text-align:left;padding:0.5rem 0.75rem;color:#4e5d56;">${escapeHtml(label)}</th>
                    <td style="padding:0.5rem 0.75rem;">${escapeHtml(value || 'N/A')}</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          `);
        })
        .catch(() => showToast('Error loading member', 'error'));
    }

    function editMember(id) {
      apiFetch(`/members/${id}`)
        .then(member => {
          const form = `
            <h2><i class="fas fa-user-edit"></i> Edit Member</h2>
            <form id="editMemberForm">
              <div class="form-row">
                <div class="form-group"><label>Full Name</label><input type="text" name="full_name" value="${escapeHtml(member.full_name || '')}" required></div>
                <div class="form-group"><label>Phone</label><input type="tel" name="phone" value="${escapeHtml(member.phone || '')}"></div>
              </div>
              <div class="form-row">
                <div class="form-group"><label>NIN</label><input type="text" name="nin" value="${escapeHtml(member.nin || '')}" required></div>
                <div class="form-group"><label>Status</label>
                  <select name="status">
                    ${['active', 'inactive', 'pending'].map(status => `<option value="${status}" ${status === member.status ? 'selected' : ''}>${status}</option>`).join('')}
                  </select>
                </div>
              </div>
              <div class="form-row">
                <div class="form-group"><label>Village</label><input type="text" name="village" value="${escapeHtml(member.village || '')}"></div>
                <div class="form-group"><label>District</label><input type="text" name="district" value="${escapeHtml(member.district || '')}"></div>
              </div>
              <div class="form-row">
                <div class="form-group"><label>Next of Kin Name</label><input type="text" name="next_of_kin_name" value="${escapeHtml(member.next_of_kin_name || '')}"></div>
                <div class="form-group"><label>Next of Kin Phone</label><input type="tel" name="next_of_kin_phone" value="${escapeHtml(member.next_of_kin_phone || '')}"></div>
              </div>
              <div class="form-actions">
                <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
                <button type="submit" class="btn-primary">Update</button>
              </div>
            </form>
          `;
          openModal(form);

          document.getElementById('editMemberForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const formData = new FormData(this);
            const payload = Object.fromEntries(formData.entries());
            apiFetch(`/members/${id}`, {
              method: 'PUT',
              body: JSON.stringify(payload)
            }).then(data => {
              if (data.success) {
                showToast('Member updated');
                closeModal();
                loadMembers();
              } else {
                showToast(data.error || 'Update failed', 'error');
              }
            }).catch(() => showToast('Server error', 'error'));
          });
        })
        .catch(() => showToast('Error loading member', 'error'));
    }

    // ============================================================
    // INIT
    // ============================================================
    loadSaccoLogo();
    const savedUser = localStorage.getItem('user');
    if (token && savedUser) {
      currentUser = JSON.parse(savedUser);
      showApp();
    } else {
      document.getElementById('loginScreen').style.display = 'flex';
      document.getElementById('appShell').style.display = 'none';
    }
  </script>
</body>
