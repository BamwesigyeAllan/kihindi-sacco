<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KIHINDI SACCO – Management System</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        /* ============================================================
           GLOBAL RESET & BASE
           ============================================================ */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        :root { --primary: #1A4D2E; --primary-light: #2a6d3e; --gold: #D4A017; --gold-light: #f0c040; --bg: #f5f2e6; --white: #ffffff; --shadow: 0 2px 12px rgba(0,0,0,0.06); --shadow-hover: 0 8px 30px rgba(0,0,0,0.1); --radius: 12px; --radius-sm: 8px; --border: #e8e5dd; --text: #1a1a2e; --text-muted: #6b6b7b; }
        body { background: var(--bg); display: flex; min-height: 100vh; font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }

        /* ============================================================
           SIDEBAR
           ============================================================ */
        .sidebar {
            width: 250px;
            background: var(--primary);
            color: white;
            padding: 1.5rem 1rem;
            position: fixed;
            top: 0; left: 0; bottom: 0;
            overflow-y: auto;
            transition: transform 0.3s ease;
            z-index: 100;
        }
        .sidebar .brand { font-size: 1.4rem; font-weight: 700; display: flex; align-items: center; gap: 10px; margin-bottom: 2rem; }
        .sidebar .brand i { color: var(--gold); font-size: 1.6rem; }
        .sidebar .brand span { color: var(--gold); }
        .sidebar nav a {
            display: flex; align-items: center; gap: 12px;
            padding: 0.7rem 1rem;
            color: rgba(255,255,255,0.7);
            text-decoration: none;
            border-radius: var(--radius-sm);
            transition: 0.2s;
            margin-bottom: 0.2rem;
            cursor: pointer;
        }
        .sidebar nav a:hover, .sidebar nav a.active {
            background: rgba(255,255,255,0.1);
            color: white;
        }
        .sidebar nav a.active { background: var(--gold); color: var(--primary); font-weight: 600; }
        .sidebar .logout { margin-top: 2rem; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 1rem; }

        /* ============================================================
           MAIN CONTENT
           ============================================================ */
        .main-content {
            margin-left: 250px;
            flex: 1;
            padding: 1.5rem 2rem;
            min-height: 100vh;
        }

        /* ============================================================
           TOP HEADER
           ============================================================ */
        .top-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 1rem;
        }
        .top-header .left { display: flex; align-items: center; gap: 1rem; }
        .top-header .hamburger { display: none; font-size: 1.5rem; cursor: pointer; background: none; border: none; color: var(--primary); }
        .top-header h1 { font-size: 1.6rem; font-weight: 600; color: var(--text); }
        .top-header .user-info { display: flex; align-items: center; gap: 1rem; }
        .top-header .user-info .badge {
            background: var(--gold);
            color: var(--primary);
            padding: 0.2rem 0.8rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        /* ============================================================
           STATS CARDS
           ============================================================ */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }
        .stat-card {
            background: var(--white);
            padding: 1.2rem 1.5rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            transition: 0.25s ease;
        }
        .stat-card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-3px);
            border-color: var(--gold);
        }
        .stat-card .stat-number { font-size: 1.6rem; font-weight: 700; color: var(--primary); }
        .stat-card .stat-label { color: var(--text-muted); font-size: 0.85rem; }
        .stat-card .stat-icon { float: right; font-size: 2rem; color: var(--gold-light); }

        /* ============================================================
           CARDS
           ============================================================ */
        .card {
            background: var(--white);
            border-radius: var(--radius);
            padding: 1.5rem;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
            transition: 0.25s ease;
        }
        .card:hover { box-shadow: var(--shadow-hover); }
        .card-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 1rem;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .card-header h2 { font-size: 1.1rem; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 8px; }
        .card-header h2 i { color: var(--gold); }
        .card-header .btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.4rem 1.2rem;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-weight: 500;
            font-size: 0.85rem;
            transition: 0.2s;
        }
        .card-header .btn:hover { background: var(--primary-light); }
        .card-header .btn-gold { background: var(--gold); color: var(--primary); }
        .card-header .btn-gold:hover { background: var(--gold-light); }
        .card-header .view-all { color: var(--gold); text-decoration: none; font-size: 0.85rem; font-weight: 500; }
        .card-header .view-all:hover { text-decoration: underline; }

        /* ============================================================
           TABLES
           ============================================================ */
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; }
        table thead th {
            background: #f5f3ed;
            color: var(--text);
            font-weight: 600;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 0.6rem 0.5rem;
            text-align: left;
            border-bottom: 2px solid var(--border);
        }
        table tbody td {
            padding: 0.6rem 0.5rem;
            border-bottom: 1px solid #f5f3ec;
            font-size: 0.9rem;
            color: var(--text);
        }
        table tbody tr:hover { background: #faf8f0; }

        /* ============================================================
           FORMS
           ============================================================ */
        .form-group { margin-bottom: 1rem; }
        .form-group label { display: block; font-weight: 500; margin-bottom: 0.2rem; font-size: 0.9rem; color: var(--text); }
        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 0.6rem 0.8rem;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 0.95rem;
            transition: 0.2s;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: var(--gold);
            outline: none;
            box-shadow: 0 0 0 3px rgba(212,160,23,0.15);
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .form-actions { display: flex; gap: 1rem; justify-content: flex-end; margin-top: 1rem; }
        .form-actions .btn-primary { background: var(--primary); color: white; border: none; padding: 0.6rem 2rem; border-radius: var(--radius-sm); cursor: pointer; font-weight: 600; transition: 0.2s; }
        .form-actions .btn-primary:hover { background: var(--primary-light); }
        .form-actions .btn-secondary { background: #e8e5dd; color: var(--text); border: none; padding: 0.6rem 2rem; border-radius: var(--radius-sm); cursor: pointer; font-weight: 500; transition: 0.2s; }
        .form-actions .btn-secondary:hover { background: #d5d0c5; }
        .checkbox-group { display: flex; gap: 1.5rem; flex-wrap: wrap; align-items: center; }
        .checkbox-group label { font-weight: 400; display: flex; align-items: center; gap: 6px; font-size: 0.9rem; }
        .checkbox-group input[type="checkbox"], .checkbox-group input[type="radio"] { width: 18px; height: 18px; accent-color: var(--primary); }

        /* ============================================================
           BADGES
           ============================================================ */
        .badge {
            padding: 0.15rem 0.5rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .badge-active { background: #d4edda; color: #155724; }
        .badge-pending { background: #fff3cd; color: #856404; }
        .badge-inactive { background: #f8d7da; color: #721c24; }
        .badge-completed { background: #cce5ff; color: #004085; }
        .badge-matured { background: #d1ecf1; color: #0c5460; }
        .badge-withdrawn { background: #f8d7da; color: #721c24; }

        /* ============================================================
           MODAL
           ============================================================ */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 200;
            backdrop-filter: blur(2px);
        }
        .modal.active { display: flex; }
        .modal-content {
            background: var(--white);
            padding: 2rem;
            border-radius: var(--radius);
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            position: relative;
        }
        .modal-content .close {
            position: absolute;
            top: 1rem; right: 1.5rem;
            font-size: 1.8rem;
            cursor: pointer;
            color: #999;
            transition: 0.2s;
        }
        .modal-content .close:hover { color: #333; }
        .modal-content h2 { color: var(--primary); margin-bottom: 1rem; }

        /* ============================================================
           PHOTO UPLOAD
           ============================================================ */
        .photo-upload {
            border: 2px dashed var(--border);
            padding: 1rem;
            text-align: center;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: 0.2s;
            background: #faf8f2;
        }
        .photo-upload:hover { border-color: var(--gold); background: #f5f0e6; }

        /* ============================================================
           TOAST
           ============================================================ */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 0.8rem 1.5rem;
            border-radius: var(--radius-sm);
            color: white;
            font-weight: 500;
            z-index: 999;
            box-shadow: 0 4px 16px rgba(0,0,0,0.2);
            animation: slideUp 0.3s ease;
            max-width: 400px;
        }
        .toast.success { background: var(--primary); }
        .toast.error { background: #c0392b; }
        .toast.info { background: #2980b9; }
        @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

        /* ============================================================
           LOGIN
           ============================================================ */
        .login-container {
            max-width: 400px;
            margin: 2rem auto;
            background: var(--white);
            padding: 2.5rem;
            border-radius: var(--radius);
            box-shadow: 0 20px 60px rgba(0,0,0,0.1);
        }
        .login-container h1 { color: var(--primary); text-align: center; margin-bottom: 0.2rem; }
        .login-container .motto { color: var(--gold); text-align: center; font-style: italic; margin-bottom: 1.5rem; }
        .login-container .form-group { margin-bottom: 1rem; }
        .login-container .btn { width: 100%; padding: 0.8rem; background: var(--primary); color: white; border: none; border-radius: var(--radius-sm); font-size: 1rem; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .login-container .btn:hover { background: var(--primary-light); }

        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); }
            .sidebar.open { transform: translateX(0); }
            .main-content { margin-left: 0; padding: 1rem; }
            .top-header .hamburger { display: block; }
            .form-row { grid-template-columns: 1fr; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
        }
        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- ===================== SIDEBAR ===================== -->
    <aside class="sidebar" id="sidebar">
        <div class="brand"><i class="fas fa-hand-holding-heart"></i> KIHINDI <span>SACCO</span></div>
        <nav>
            <a class="active" data-page="dashboard"><i class="fas fa-chart-pie"></i> Dashboard</a>
            <a data-page="members"><i class="fas fa-users"></i> Members</a>
            <a data-page="savings"><i class="fas fa-piggy-bank"></i> Savings</a>
            <a data-page="deposits"><i class="fas fa-file-invoice"></i> Fixed Deposits</a>
            <a data-page="loans"><i class="fas fa-hand-holding-usd"></i> Loans</a>
            <a data-page="reports"><i class="fas fa-flag"></i> Reports</a>
            <a class="logout" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </nav>
    </aside>

    <!-- ===================== MAIN CONTENT ===================== -->
    <div class="main-content">

        <!-- Top Header -->
        <div class="top-header">
            <div class="left">
                <button class="hamburger" onclick="toggleSidebar()"><i class="fas fa-bars"></i></button>
                <h1 id="pageTitle">Dashboard</h1>
            </div>
            <div class="user-info">
                <span id="userName">Admin</span>
                <span class="badge" id="userRole">admin</span>
            </div>
        </div>

        <!-- Page Content -->
        <div id="pageContent"></div>

    </div>

    <!-- ===================== MODAL ===================== -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

    <!-- ===================== TOAST ===================== -->
    <div id="toast" style="display:none;" class="toast"></div>

    <!-- ===================== JAVASCRIPT ===================== -->
    <script>
        // ============================================================
        // GLOBALS
        // ============================================================
        let token = localStorage.getItem('token');
        let currentUser = null;
        let charts = {};

        // ============================================================
        // AUTH
        // ============================================================
        function login(username, password) {
            fetch('/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            })
            .then(res => res.json())
            .then(data => {
                if (data.token) {
                    token = data.token;
                    localStorage.setItem('token', token);
                    currentUser = data.user;
                    localStorage.setItem('user', JSON.stringify(currentUser));
                    document.getElementById('userName').textContent = currentUser.username;
                    document.getElementById('userRole').textContent = currentUser.role;
                    loadPage('dashboard');
                } else {
                    showToast(data.error || 'Login failed', 'error');
                }
            })
            .catch(() => showToast('Server error', 'error'));
        }

        function logout() {
            localStorage.removeItem('token');
            localStorage.removeItem('user');
            token = null;
            currentUser = null;
            renderLogin();
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
        }

        // ============================================================
        // API HELPER
        // ============================================================
        function apiFetch(endpoint, options = {}) {
            return fetch(endpoint, {
                ...options,
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`,
                    ...options.headers
                }
            }).then(res => {
                if (res.status === 401) { logout(); throw new Error('Session expired'); }
                return res.json();
            });
        }

        // ============================================================
        // NAVIGATION
        // ============================================================
        document.querySelectorAll('.sidebar nav a[data-page]').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                const page = link.dataset.page;
                loadPage(page);
                if (window.innerWidth <= 768) document.getElementById('sidebar').classList.remove('open');
            });
        });

        function loadPage(page) {
            document.querySelectorAll('.sidebar nav a[data-page]').forEach(a => a.classList.remove('active'));
            document.querySelector(`.sidebar nav a[data-page="${page}"]`)?.classList.add('active');
            document.getElementById('pageTitle').textContent = page.charAt(0).toUpperCase() + page.slice(1);

            switch(page) {
                case 'dashboard': loadDashboard(); break;
                case 'members': loadMembers(); break;
                case 'savings': loadSavings(); break;
                case 'deposits': loadDeposits(); break;
                case 'loans': loadLoans(); break;
                case 'reports': loadReports(); break;
                default: document.getElementById('pageContent').innerHTML = '<p>Page not found</p>';
            }
        }

        // ============================================================
        // TOAST
        // ============================================================
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = `toast ${type}`;
            toast.style.display = 'block';
            setTimeout(() => { toast.style.display = 'none'; }, 4000);
        }

        // ============================================================
        // MODAL
        // ============================================================
        function openModal(html) {
            document.getElementById('modalBody').innerHTML = html;
            document.getElementById('modal').classList.add('active');
        }
        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        // ============================================================
        // GET USER ROLE FROM TOKEN
        // ============================================================
        function getUserRole() {
            try {
                const payload = JSON.parse(atob(token.split('.')[1]));
                return payload.role;
            } catch (e) {
                return null;
            }
        }

        // ============================================================
        // DASHBOARD
        // ============================================================
        function loadDashboard() {
            apiFetch('/reports/dashboard')
                .then(data => {
                    let html = `
                        <div class="stats-grid">
                            <div class="stat-card">
                                <i class="fas fa-user-friends stat-icon"></i>
                                <div class="stat-number">${data.totalMembers || 0}</div>
                                <div class="stat-label">Members</div>
                            </div>
                            <div class="stat-card">
                                <i class="fas fa-piggy-bank stat-icon"></i>
                                <div class="stat-number">UGX ${Number(data.totalSavings || 0).toLocaleString()}</div>
                                <div class="stat-label">Savings</div>
                            </div>
                            <div class="stat-card">
                                <i class="fas fa-coins stat-icon"></i>
                                <div class="stat-number">UGX ${Number(data.totalDeposits || 0).toLocaleString()}</div>
                                <div class="stat-label">Fixed Deposits</div>
                            </div>
                            <div class="stat-card">
                                <i class="fas fa-hand-holding-usd stat-icon"></i>
                                <div class="stat-number">UGX ${Number(data.outstandingLoans || 0).toLocaleString()}</div>
                                <div class="stat-label">Outstanding Loans</div>
                            </div>
                        </div>
                        <div class="card">
                            <div class="card-header">
                                <h2><i class="fas fa-clock"></i> Recent Transactions</h2>
                                <a href="#" class="view-all">View All →</a>
                            </div>
                            <div class="table-responsive">
                                <table>
                                    <thead><tr><th>Date</th><th>Member</th><th>Type</th><th>Amount</th></tr></thead>
                                    <tbody>
                                        ${data.recentTransactions && data.recentTransactions.length ? data.recentTransactions.map(t => `
                                            <tr><td>${t.created_at}</td><td>${t.Member?.full_name || 'N/A'}</td><td>${t.type}</td><td>UGX ${Number(t.amount).toLocaleString()}</td></tr>
                                        `).join('') : '<tr><td colspan="4" style="text-align:center;color:#999;">No transactions</td></tr>'}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    `;
                    document.getElementById('pageContent').innerHTML = html;
                })
                .catch(() => showToast('Error loading dashboard', 'error'));
        }

        // ============================================================
        // MEMBERS
        // ============================================================
        function loadMembers() {
            apiFetch('/members')
                .then(data => {
                    let rows = data.map(m => `
                        <tr>
                            <td>${m.membership_no}</td>
                            <td>${m.full_name}</td>
                            <td>${m.nin}</td>
                            <td>${m.phone}</td>
                            <td><span class="badge badge-${m.status}">${m.status}</span></td>
                            <td>
                                <button class="btn" style="padding:0.2rem 0.6rem;font-size:0.75rem;" onclick="viewMember(${m.id})">View</button>
                                <button class="btn btn-gold" style="padding:0.2rem 0.6rem;font-size:0.75rem;" onclick="editMember(${m.id})">Edit</button>
                            </td>
                        </tr>
                    `).join('');
                    let html = `
                        <div class="card">
                            <div class="card-header">
                                <h2><i class="fas fa-users"></i> Members</h2>
                                <button class="btn" onclick="openMemberForm()"><i class="fas fa-plus"></i> Add Member</button>
                            </div>
                            <div class="table-responsive">
                                <table>
                                    <thead><tr><th>ID</th><th>Name</th><th>NIN</th><th>Phone</th><th>Status</th><th>Action</th></tr></thead>
                                    <tbody>${rows || '<tr><td colspan="6" style="text-align:center;color:#999;">No members</td></tr>'}</tbody>
                                </table>
                            </div>
                        </div>
                    `;
                    document.getElementById('pageContent').innerHTML = html;
                })
                .catch(() => showToast('Error loading members', 'error'));
        }

        function openMemberForm() {
            const form = `
                <h2><i class="fas fa-user-plus"></i> Register Member</h2>
                <form id="memberForm" enctype="multipart/form-data">
                    <div class="form-row">
                        <div class="form-group"><label>Full Name *</label><input type="text" name="full_name" required></div>
                        <div class="form-group"><label>Gender</label><select name="gender"><option>Male</option><option>Female</option><option>Other</option></select></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>Date of Birth</label><input type="date" name="date_of_birth"></div>
                        <div class="form-group"><label>National ID *</label><input type="text" name="nin" required></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>Phone *</label><input type="tel" name="phone" required></div>
                        <div class="form-group"><label>Password *</label><input type="password" name="member_password" required></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>Marital Status</label><select name="marital_status"><option>Single</option><option>Married</option><option>Divorced</option><option>Widowed</option></select></div>
                        <div class="form-group"><label>Occupation</label><input type="text" name="occupation"></div>
                    </div>
                    <div class="form-group"><label>Residential Address</label><input type="text" name="address" placeholder="Village, Parish, Sub-County, District"></div>
                    <div class="form-row">
                        <div class="form-group"><label>Stage Name</label><input type="text" name="stage_name" placeholder="Boda Boda Stage"></div>
                        <div class="form-group"><label>Share Capital (UGX)</label><input type="number" name="share_capital" value="0"></div>
                    </div>
                    <div class="form-row">
                        <div class="form-group"><label>Next of Kin Name *</label><input type="text" name="next_of_kin_name" required></div>

        function openLoanApply() {
            // Load loan products
            apiFetch('/loans/products')
                .then(products => {
                    let productOptions = products.map(p => `
                        <option value="${p.id}" data-rate="${p.interest_rate}" data-desc="${p.description || ''}">${p.product_name} (${p.interest_rate}% p.a.)</option>
                    `).join('');

                    const form = `
                        <h2><i class="fas fa-hand-holding-usd"></i> Apply for Loan</h2>
                        <form id="loanForm">
                            <div class="form-group">
                                <label>Member ID</label>
                                <input type="number" name="member_id" required>
                            </div>
                            <div class="form-group">
                                <label>Loan Product</label>
                                <select name="product_id" required onchange="updateLoanRates(this)">
                                    <option value="">Select a product...</option>
                                    ${productOptions}
                                </select>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label>Amount (UGX)</label>
                                    <input type="number" name="amount" required>
                                </div>
                                <div class="form-group">
                                    <label>Repayment Period (Months)</label>
                                    <input type="number" name="repayment_period_months" required>
                                </div>
                            </div>
                            <div class="form-group" id="insuranceGroup">
                                <label>Insurance Fee (UGX) <span style="color:#888;font-size:0.8rem;">(Admin/Treasurer/Loans Officer only)</span></label>
                                <input type="number" name="insurance_fee" value="5000" step="100">
                            </div>
                            <div class="form-actions">
                                <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
                                <button type="submit" class="btn-primary">Submit Application</button>
                            </div>
                        </form>
                    `;
                    openModal(form);

                    // Show/hide insurance fee based on role
                    const role = getUserRole();
                    const allowedRoles = ['admin', 'chairperson', 'manager', 'loans_officer', 'treasurer'];
                    if (role && allowedRoles.includes(role)) {
                        document.getElementById('insuranceGroup').style.display = 'block';
                    } else {
                        document.getElementById('insuranceGroup').style.display = 'none';
                    }

                    document.getElementById('loanForm').addEventListener('submit', function(e) {
                        e.preventDefault();
                        const formData = new FormData(this);
                        const obj = {};
                        formData.forEach((value, key) => obj[key] = value);
                        apiFetch('/loans', {
                            method: 'POST',
                            body: JSON.stringify(obj)
                        })
                        .then(data => {
                            if (data.success) {
                                showToast(`Loan application submitted! Loan ID: ${data.loan.loan_id}`);
                                closeModal();
                                loadLoans();
                                loadDashboard();
                            } else {
                                showToast(data.error || 'Loan application failed', 'error');
                            }
                        })
                        .catch(() => showToast('Server error', 'error'));
                    });
                })
                .catch(() => showToast('Error loading loan products', 'error'));
        }

            // Simple approve – you can call a PUT endpoint if you have one

        function loadCharts() {
            // Deposits chart
            apiFetch('/reports/deposits-chart')
                .then(data => {
                    const ctx = document.getElementById('depositsChart')?.getContext('2d');
                    if (!ctx) return;
                    if (charts.deposits) charts.deposits.destroy();
                    charts.deposits = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: data.map(d => d.month),
                            datasets: [{
                                label: 'Deposits (UGX)',
                                data: data.map(d => d.total),
                                backgroundColor: 'rgba(26,77,46,0.6)',
                                borderColor: '#1A4D2E',
                                borderWidth: 1
                            }]
                        },
                        options: { responsive: true, plugins: { legend: { display: false } } }
                    });
                });

            // Loans chart
            apiFetch('/reports/loans-chart')
                .then(data => {
                    const ctx = document.getElementById('loansChart')?.getContext('2d');
                    if (!ctx) return;
                    if (charts.loans) charts.loans.destroy();
                    charts.loans = new Chart(ctx, {
                        type: 'pie',
                        data: {
                            labels: data.map(d => d.product),
                            datasets: [{
                                data: data.map(d => d.total),
                                backgroundColor: ['#1A4D2E', '#D4A017', '#2a6d3e', '#f0c040']
                            }]
                        },
                        options: { responsive: true }
                    });
                });
        }

        function exportReport(type) {
            showToast(`Exporting ${type} report... (Demo)`, 'info');
        }

                    </p>

            document.getElementById('pageTitle').textContent = 'Login';
        }

        // ============================================================
        // INIT
        // ============================================================
        const savedUser = localStorage.getItem('user');
        if (token && savedUser) {
            currentUser = JSON.parse(savedUser);
            document.getElementById('userName').textContent = currentUser.username;
            document.getElementById('userRole').textContent = currentUser.role;
            loadPage('dashboard');
        } else {
            renderLogin();
        }

        // Login with Enter key
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && document.getElementById('loginUser')) {
                login(document.getElementById('loginUser').value, document.getElementById('loginPass').value);
            }
        });
